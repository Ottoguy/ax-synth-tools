# Publishes the web editor (app/) to GitHub Pages: https://ottoguy.github.io/ax-synth-tools/
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish web editor (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (the editor only)
        run: |
          mkdir site
          cp app/index.html app/style.css app/*.js app/model.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

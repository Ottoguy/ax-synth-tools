# ================================================================= PIANO ======
[[mfx]]
number = 78
name = "SYMPATHETIC RESONANCE"
category = "PIANO"
pages = [76]
description = "On an acoustic piano, holding the damper pedal lets other strings resonate in sympathy with the notes played, creating rich, spacious resonance. This effect simulates these sympathetic resonances (followed by a 3-band EQ)."

[[mfx.param]]
label = "Depth"
schema = ["depth"]
values = "0–127"
meaning = "Depth of the effect."
control = true

[[mfx.param]]
label = "Damper"
schema = ["damp"]
values = "0–127"
meaning = "Depth to which the damper pedal is pressed (controls the resonant sound)."
control = true

[[mfx.param]]
label = "Pre LPF"
schema = ["preLpf"]
values = "16–15000 Hz, BYPASS"
meaning = "Frequency of the filter that cuts the high-frequency content of the input sound (BYPASS: no cut)."

[[mfx.param]]
label = "Pre HPF"
schema = ["preHpf"]
values = "BYPASS, 16–15000 Hz"
meaning = "Frequency of the filter that cuts the low-frequency content of the input sound (BYPASS: no cut)."

[[mfx.param]]
label = "Peaking Freq"
schema = ["pkgFreq"]
values = "200–8000 Hz"
meaning = "Frequency of the filter that boosts/cuts a specific region of the input sound."

[[mfx.param]]
label = "Peaking Gain"
schema = ["pkgGain"]
values = "-15–+15 dB"
meaning = "Amount of boost/cut at the Peaking Freq."

[[mfx.param]]
label = "Peaking Q"
schema = ["pkgQ"]
values = "0.5, 1.0, 2.0, 4.0, 8.0"
meaning = "Width of the region boosted/cut by Peaking Gain (larger values = narrower)."

[[mfx.param]]
label = "HF Damp"
schema = ["hfDamp"]
values = "16–15000 Hz, BYPASS"
meaning = "Frequency at which the high-frequency content of the resonant sound is cut (BYPASS: no cut)."

[[mfx.param]]
label = "LF Damp"
schema = ["lfDamp"]
values = "BYPASS, 16–15000 Hz"
meaning = "Frequency at which the low-frequency content of the resonant sound is cut (BYPASS: no cut)."

[[mfx.param]]
label = "Lid"
schema = ["lid"]
values = "1–6"
meaning = "Simulates the change in sound when the lid of a grand piano is set at different heights."

[[mfx.param]]
label = "EQ Low Freq / EQ Low Gain"
schema = ["loFreq", "loGain"]
values = "200, 400 Hz / -15–+15 dB"
meaning = "Frequency and amount of the low-range EQ boost/cut."

[[mfx.param]]
label = "EQ Mid Freq / EQ Mid Gain / EQ Mid Q"
schema = ["midFreq", "midGain", "midQ"]
values = "200–8000 Hz / -15–+15 dB / 0.5, 1.0, 2.0, 4.0, 8.0"
meaning = "Frequency, amount and width (larger Q = narrower) of the midrange EQ."

[[mfx.param]]
label = "EQ High Freq / EQ High Gain"
schema = ["hiFreq", "hiGain"]
values = "2000, 4000, 8000 Hz / -15–+15 dB"
meaning = "Frequency and amount of the high-range EQ boost/cut."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

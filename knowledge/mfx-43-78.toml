# AX-Synth knowledge base: MFX (multi-effect) types 43-78
# Source: AX-Synth Editor manual (EM) "Effects List" p.62-76. Format: knowledge/README.md
# (same fields as mfx-01-42.toml).

# ================================================================= DELAY ======
[[mfx]]
number = 43
name = "DELAY"
category = "DELAY"
pages = [62]
description = "A stereo delay. Feedback Mode NORMAL feeds each channel back into itself; CROSS feeds each channel back into the opposite channel."

[[mfx.param]]
label = "Delay Left / Delay Right"
schema = ["dlyLMsec", "dlyRMsec"]
values = "0–1300 msec"
meaning = "Time until the delay sound is heard (left / right)."

[[mfx.param]]
label = "Phase Left / Phase Right"
schema = ["phsL", "phsR"]
values = "NORMAL, INVERSE"
meaning = "Phase of the delay sound (left / right)."

[[mfx.param]]
label = "Feedback Mode"
schema = ["fbkMode"]
values = "NORMAL, CROSS"
meaning = "How the delay sound is fed back into the effect (NORMAL: same channel; CROSS: crossed L/R)."

[[mfx.param]]
label = "Feedback"
schema = ["fbk"]
values = "-98–+98%"
meaning = "Amount of delay sound fed back into the effect; negative inverts the phase."
control = true

[[mfx.param]]
label = "HF Damp"
schema = ["hfDamp"]
values = "200–8000 Hz, BYPASS"
meaning = "Frequency above which the fed-back sound is filtered out. BYPASS: no high frequencies are filtered."

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high frequency range."

[[mfx.param]]
label = "Balance"
schema = ["bal"]
values = "D100:0W–D0:100W"
meaning = "Volume balance between the direct sound (D) and the delay sound (W)."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 44
name = "LONG DELAY"
category = "DELAY"
pages = [62]
description = "A delay that provides a long delay time."

[[mfx.param]]
label = "Delay Time"
schema = ["dlyMsec"]
values = "0–2600 msec"
meaning = "Delay from the original sound until the delay sound is heard."

[[mfx.param]]
label = "Phase"
schema = ["phs"]
values = "NORMAL, INVERSE"
meaning = "Phase of the delay (non-inverted / inverted)."

[[mfx.param]]
label = "Feedback"
schema = ["fbk"]
values = "-98–+98%"
meaning = "Proportion of the delay sound returned to the input (negative inverts the phase)."
control = true

[[mfx.param]]
label = "HF Damp"
schema = ["hfDamp"]
values = "200–8000 Hz, BYPASS"
meaning = "Frequency at which the high-frequency content of the delayed sound is cut (BYPASS: no cut)."

[[mfx.param]]
label = "Pan"
schema = ["pan"]
values = "L64–63R"
meaning = "Panning of the delay sound."
control = true

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Boost/cut for the low / high frequency range."
notes = ["The manual text describes Low Gain as 'high-frequency range', evidently a typo."]

[[mfx.param]]
label = "Balance"
schema = ["bal"]
values = "D100:0W–D0:100W"
meaning = "Volume balance of the original sound (D) and the delay sound (W)."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output volume."


# ================================================================= LO-FI ======
[[mfx]]
number = 56
name = "LOFI NOISE"
category = "LO-FI"
pages = [68]
description = "A lo-fi effect that also adds various types of noise such as white noise and disc (record) noise."

[[mfx.param]]
label = "LoFi Type"
schema = ["lofiType"]
values = "1–9"
meaning = "Degrades the sound quality; poorer as the value increases."

[[mfx.param]]
label = "Post Filter Type"
schema = ["filType"]
values = "OFF, LPF, HPF"
meaning = "Filter following the LoFi effect. OFF: none. LPF: cuts above the cutoff. HPF: cuts below the cutoff."

[[mfx.param]]
label = "Post Filter Cutoff"
schema = ["cutoff"]
values = "200–8000 Hz"
meaning = "Center frequency of the filter."

[[mfx.param]]
label = "W/P Noise Type"
schema = ["wPType"]
values = "WHITE, PINK"
meaning = "Switches between white noise and pink noise."

[[mfx.param]]
label = "W/P Noise LPF"
schema = ["wPLpf"]
values = "200–8000 Hz, BYPASS"
meaning = "Center frequency of the low pass filter applied to the white/pink noise (BYPASS: no cut)."

[[mfx.param]]
label = "W/P Noise Level"
schema = ["wPLevel"]
values = "0–127"
meaning = "Volume of the white/pink noise."
control = true

[[mfx.param]]
label = "Disc Noise Type"

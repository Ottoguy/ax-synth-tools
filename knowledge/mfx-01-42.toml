[[mfx]]
number = 15
name = "RING MODULATOR"
category = "MODULATION"
pages = [51]
description = "Applies amplitude modulation (AM) to the input signal, producing bell-like sounds. The modulation frequency can also change in response to the volume of the sound sent into the effect."

[[mfx.param]]
label = "Frequency"
schema = ["freq"]
values = "0–127"
meaning = "Frequency at which modulation is applied."
control = true

[[mfx.param]]
label = "Sens"
schema = ["sens"]
values = "0–127"
meaning = "Amount of frequency modulation applied (response to input volume)."
control = true

[[mfx.param]]
label = "Polarity"
schema = ["polarity"]
values = "UP, DOWN"
meaning = "Whether the frequency modulation moves toward higher (UP) or lower (DOWN) frequencies."

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high frequency range."

[[mfx.param]]
label = "Balance"
schema = ["bal"]
values = "D100:0W–D0:100W"
meaning = "Volume balance between the direct sound (D) and the effect sound (W)."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 16
name = "STEP RING MODULATOR"
category = "MODULATION"
pages = [51]
description = "A ring modulator that uses a 16-step sequence to vary the modulation frequency (STEP RESET available)."

[[mfx.param]]
label = "Step 01–16"
schema = ["step01", "step02", "step03", "step04", "step05", "step06", "step07", "step08", "step09", "step10", "step11", "step12", "step13", "step14", "step15", "step16"]
values = "0–127"
meaning = "Frequency of ring modulation at each step."

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]

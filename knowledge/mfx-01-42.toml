# AX-Synth knowledge base: MFX (multi-effect) types 01-42
# Source: AX-Synth Editor manual (EM) "Effects List" p.44-61. Format: knowledge/README.md.
#
# [[mfx]]: number (= stored mfxType), name (= A8EE.exe display name), manual_name (as printed
#   when different), category, pages, description, notes.
# [[mfx.param]]: label, schema (member names inside this type's union group in Script.xml,
#   i.e. fm.pat.mfx.<prefix>-<member>), values, meaning, control (true = marked '#': usable as
#   Multi-Effect Control / Matrix Control destination; "#1"/"#2" = two items change together).
# Stored values of all MFX parameters are offset by 32768 (see script-analysis.md).

# ================================================================ FILTER ======
[[mfx]]
number = 1
name = "EQUALIZER"
category = "FILTER"
pages = [46]
description = "A four-band stereo equalizer (low, mid x 2, high)."

[[mfx.param]]
label = "Low Freq"
schema = ["loFreq"]
values = "200, 400 Hz"
meaning = "Frequency of the low range."

[[mfx.param]]
label = "Low Gain"
schema = ["loGain"]
values = "-15–+15 dB"
meaning = "Gain of the low range."
control = true

[[mfx.param]]
label = "Mid1 Freq"
schema = ["mid1Freq"]
values = "200–8000 Hz"
meaning = "Frequency of the middle range 1."

[[mfx.param]]
label = "Mid1 Gain"
schema = ["mid1Gain"]
values = "-15–+15 dB"
meaning = "Gain of the middle range 1."

[[mfx.param]]
label = "Mid1 Q"
schema = ["mid1Q"]
values = "0.5, 1.0, 2.0, 4.0, 8.0"
meaning = "Width of the middle range 1. A higher Q narrows the range affected."

[[mfx.param]]
label = "Mid2 Freq"
schema = ["mid2Freq"]
values = "200–8000 Hz"
meaning = "Frequency of the middle range 2."

[[mfx.param]]
label = "Mid2 Gain"
schema = ["mid2Gain"]
values = "-15–+15 dB"
meaning = "Gain of the middle range 2."

[[mfx.param]]
label = "Mid2 Q"
schema = ["mid2Q"]
values = "0.5, 1.0, 2.0, 4.0, 8.0"
meaning = "Width of the middle range 2. A higher Q narrows the range affected."

[[mfx.param]]
label = "High Freq"
schema = ["hiFreq"]
values = "2000, 4000, 8000 Hz"
meaning = "Frequency of the high range."

[[mfx.param]]
label = "High Gain"
schema = ["hiGain"]
values = "-15–+15 dB"
meaning = "Gain of the high range."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."
control = true

[[mfx]]
number = 2
name = "SPECTRUM"
category = "FILTER"
pages = [46]
description = "A stereo spectrum: a type of filter that modifies the timbre by boosting or cutting the level at specific frequencies."

[[mfx.param]]
label = "Band1 (250 Hz) … Band8 (8000 Hz)"
schema = ["band1", "band2", "band3", "band4", "band5", "band6", "band7", "band8"]
values = "-15–+15 dB each; bands 250, 500, 1000, 1250, 2000, 3150, 4000, 8000 Hz"
meaning = "Gain of each frequency band."

[[mfx.param]]
label = "Q"
schema = ["width"]
values = "0.5, 1.0, 2.0, 4.0, 8.0"
meaning = "Simultaneously adjusts the width of the adjusted ranges for all frequency bands."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."
control = true

[[mfx]]
number = 3
name = "ISOLATOR"
category = "FILTER"
pages = [46]
description = "An equalizer that cuts the volume greatly, allowing you to add a special effect to the sound by cutting the volume in varying ranges."

[[mfx.param]]
label = "Boost/Cut Low / Mid / High"
schema = ["loLevel", "midLevel", "hiLevel"]
values = "-60–+4 dB"
meaning = "Boost and cut each of the Low, Middle and High frequency ranges. At -60 dB the range becomes inaudible; 0 dB equals the input level."
control = true

[[mfx.param]]
label = "Anti Phase Low Sw"
schema = ["loApSw"]
values = "OFF, ON"
meaning = "Turns the Anti-Phase function on/off for the Low range. When on, the counter-channel of the stereo sound is inverted and added to the signal."

[[mfx.param]]
label = "Anti Phase Low Level"
schema = ["loAp"]
values = "0–127"
meaning = "Level of the Anti-Phase function for the Low range. Adjusting it for certain frequencies lends emphasis to specific parts (effective only for a stereo source)."

[[mfx.param]]
label = "Anti Phase Mid Sw"
schema = ["midApSw"]
values = "OFF, ON"
meaning = "Anti-Phase on/off for the Middle range (same as for Low)."

[[mfx.param]]
label = "Anti Phase Mid Level"
schema = ["midAp"]
values = "0–127"
meaning = "Anti-Phase level for the Middle range (same as for Low)."

[[mfx.param]]
label = "Low Boost Sw"
schema = ["boostSw"]
values = "OFF, ON"
meaning = "Turns the Low Booster on/off; emphasizes the bottom to create a heavy bass sound."

[[mfx.param]]
label = "Low Boost Level"
schema = ["boostLevel"]
values = "0–127"
meaning = "Increasing this value gives a heavier low end. Depending on the Isolator and filter settings this effect may be hard to distinguish."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 4
name = "LOW BOOST"
category = "FILTER"
pages = [47]
description = "Boosts the volume of the lower range, creating powerful lows."

[[mfx.param]]
label = "Boost Frequency"
schema = ["freq"]
values = "50–125 Hz"
meaning = "Center frequency at which the lower range will be boosted."
control = true

[[mfx.param]]
label = "Boost Gain"
schema = ["gain"]
values = "0–+12 dB"
meaning = "Amount by which the lower range will be boosted."
control = true

[[mfx.param]]
label = "Boost Width"
schema = ["width"]
values = "WIDE, MID, NARROW"
meaning = "Width of the lower range that will be boosted."

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high frequency range (2-band EQ)."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 5
name = "SUPER FILTER"
category = "FILTER"
pages = [47]
description = "A filter with an extremely sharp slope. The cutoff frequency can be varied cyclically."

[[mfx.param]]
label = "Filter Type"
schema = ["filtType"]
values = "LPF, BPF, HPF, NOTCH"
meaning = "Frequency range that passes: LPF below the cutoff; BPF around the cutoff; HPF above the cutoff; NOTCH everything except the region around the cutoff."

[[mfx.param]]
label = "Filter Slope"
schema = ["filtSlope"]
values = "-12, -24, -36 dB"
meaning = "Attenuation per octave: -12 dB gentle, -24 dB steep, -36 dB extremely steep."

[[mfx.param]]
label = "Filter Cutoff"
schema = ["filtCutoff"]
values = "0–127"
meaning = "Cutoff frequency; higher = higher cutoff."
control = true

[[mfx.param]]
label = "Filter Resonance"
schema = ["filtReso"]
values = "0–127"
meaning = "Filter resonance; higher emphasizes the region near the cutoff."
control = true

[[mfx.param]]
label = "Filter Gain"
schema = ["filtGain"]
values = "0–+12 dB"
meaning = "Amount of boost for the filter output."

[[mfx.param]]
label = "Modulation Sw"
schema = ["modSw"]
values = "OFF, ON"
meaning = "On/off switch for cyclic change of the cutoff."

[[mfx.param]]
label = "Modulation Wave"
schema = ["modWave"]
values = "TRI, SQR, SIN, SAW1, SAW2"
meaning = "How the cutoff is modulated: triangle, square, sine, sawtooth upward (SAW1), sawtooth downward (SAW2)."

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]
values = "0.05–10.00 Hz"
meaning = "Rate of modulation."
control = true

[[mfx.param]]
label = "Depth"
schema = ["depth"]
values = "0–127"
meaning = "Depth of modulation."

[[mfx.param]]
label = "Attack"
schema = ["attack"]
values = "0–127"
meaning = "Speed at which the cutoff changes; effective if Modulation Wave is SQR, SAW1 or SAW2."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 6
name = "STEP FILTER"
category = "FILTER"
pages = [47]
description = "A filter whose cutoff frequency can be modulated in steps; you specify the pattern by which the cutoff changes (16-step sequencer; STEP RESET available)."

[[mfx.param]]
label = "Step 01–16"
schema = ["step01", "step02", "step03", "step04", "step05", "step06", "step07", "step08", "step09", "step10", "step11", "step12", "step13", "step14", "step15", "step16"]
values = "0–127"
meaning = "Cutoff frequency at each step."

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]
values = "0.05–10.00 Hz"
meaning = "Rate of modulation (sequence speed)."
control = true

[[mfx.param]]
label = "Attack"
schema = ["attack"]
values = "0–127"
meaning = "Speed at which the cutoff changes between steps."
control = true

[[mfx.param]]
label = "Filter Type"
schema = ["filtType"]
values = "LPF, BPF, HPF, NOTCH"
meaning = "LPF passes below the cutoff; BPF around it; HPF above it; NOTCH everything except the region around it."

[[mfx.param]]
label = "Filter Slope"
schema = ["filtSlope"]
values = "-12, -24, -36 dB"
meaning = "Attenuation per octave: gentle, steep, extremely steep."

[[mfx.param]]
label = "Filter Resonance"
schema = ["filtReso"]
values = "0–127"
meaning = "Filter resonance; higher emphasizes the region near the cutoff."
control = true

[[mfx.param]]
label = "Filter Gain"
schema = ["filtGain"]
values = "0–+12 dB"
meaning = "Amount of boost for the filter output."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 7
name = "ENHANCER"
category = "FILTER"
pages = [48]
description = "Controls the overtone structure of the high frequencies, adding sparkle and tightness to the sound."

[[mfx.param]]
label = "Sens"
schema = ["sens"]
values = "0–127"
meaning = "Sensitivity of the enhancer."
control = true

[[mfx.param]]
label = "Mix"
schema = ["mix"]
values = "0–127"
meaning = "Level of the overtones generated by the enhancer."
control = true

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high range."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 8
name = "AUTO WAH"
category = "FILTER"
pages = [48]
description = "Cyclically controls a filter to create cyclic change in timbre."

[[mfx.param]]
label = "Filter Type"
schema = ["mode"]
values = "LPF, BPF"
meaning = "LPF: the wah effect is applied over a wide frequency range. BPF: over a narrow range."

[[mfx.param]]
label = "Manual"
schema = ["manual"]
values = "0–127"
meaning = "Center frequency at which the effect is applied."
control = true

[[mfx.param]]
label = "Peak"
schema = ["peak"]
values = "0–127"
meaning = "Amount of wah effect around the center frequency; a higher value narrows the affected range (like Q)."

[[mfx.param]]
label = "Sens"
schema = ["sens"]
values = "0–127"
meaning = "Sensitivity with which the filter is controlled."
control = true

[[mfx.param]]
label = "Polarity"
schema = ["polarity"]
values = "UP, DOWN"
meaning = "Direction the frequency changes when the filter is modulated: UP toward higher, DOWN toward lower."

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]
values = "0.05–10.00 Hz"
meaning = "Frequency of modulation."
control = true

[[mfx.param]]
label = "Depth"
schema = ["depth"]
values = "0–127"
meaning = "Depth of modulation."
control = true

[[mfx.param]]
label = "Phase"
schema = ["phs"]
values = "0–180 deg"
meaning = "Phase shift between the left and right sounds while the wah is applied."
control = true

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high range."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 9
name = "HUMANIZER"
category = "FILTER"
pages = [48]
description = "Adds a vowel character to the sound, making it similar to a human voice (overdrive -> formant filter -> 2-band EQ -> pan)."

[[mfx.param]]
label = "Drive Sw"
schema = ["driveSw"]
values = "OFF, ON"
meaning = "Turns Drive on/off."

[[mfx.param]]
label = "Drive"
schema = ["drv"]
values = "0–127"
meaning = "Degree of distortion; also changes the volume."
control = true

[[mfx.param]]
label = "Vowel1 / Vowel2"
schema = ["vowel1", "vowel2"]
values = "a, e, i, o, u"
meaning = "The two vowels the effect switches between."

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]
values = "0.05–10.00 Hz"
meaning = "Frequency at which the two vowels switch."
control = true

[[mfx.param]]
label = "Depth"
schema = ["depth"]
values = "0–127"
meaning = "Effect depth."
control = true

[[mfx.param]]
label = "Input Sync Sw"
schema = ["ksSw"]
values = "OFF, ON"
meaning = "Whether the LFO switching the vowels is reset by the input signal (ON) or not (OFF)."

[[mfx.param]]
label = "Input Sync Threshold"
schema = ["ksThre"]
values = "0–127"
meaning = "Volume level at which the reset is applied."

[[mfx.param]]
label = "Manual"
schema = ["manual"]
values = "0–100"
meaning = "Point at which Vowel 1/2 switch: 49 or less = Vowel 1 lasts longer; 50 = equal; 51 or more = Vowel 2 lasts longer."
control = true

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high frequency range."

[[mfx.param]]
label = "Pan"
schema = ["pan"]
values = "L64–63R"
meaning = "Stereo location of the output."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 10
name = "SPEAKER SIMULATOR"
category = "FILTER"
pages = [49]
description = "Simulates the speaker type and the mic settings used to record the speaker sound."
notes = ["Speaker types (cabinet / speaker inches x units / mic): SMALL 1 small open-back 10 dynamic; SMALL 2 small open-back 10 dynamic; MIDDLE open back 12x1 dynamic; JC-120 open back 12x2 dynamic; BUILT-IN 1 open back 12x2 dynamic; BUILT-IN 2–5 open back 12x2 condenser; BG STACK 1 sealed 12x2 condenser; BG STACK 2 large sealed 12x2 condenser; MS STACK 1 and 2 large sealed 12x4 condenser; METAL STACK large double stack 12x4 condenser; 2-STACK large double stack 12x4 condenser; 3-STACK large triple stack 12x4 condenser."]

[[mfx.param]]
label = "Speaker Type"
schema = ["spType"]
values = "SMALL 1, SMALL 2, MIDDLE, JC-120, BUILT-IN 1–5, BG STACK 1–2, MS STACK 1–2, METAL STACK, 2-STACK, 3-STACK"
meaning = "Type of speaker (see notes for cabinet/speaker/mic of each)."

[[mfx.param]]
label = "Mic Setting"
schema = ["micSetting"]
values = "1, 2, 3"
meaning = "Location of the mic recording the speaker; it becomes more distant in the order 1, 2, 3."

[[mfx.param]]
label = "Mic Level"
schema = ["micLevel"]
values = "0–127"
meaning = "Volume of the microphone."
control = true

[[mfx.param]]
label = "Direct Level"
schema = ["directLevel"]
values = "0–127"
meaning = "Volume of the direct sound."
control = true

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."
control = true

# ============================================================ MODULATION ======
[[mfx]]
number = 11
name = "PHASER"
category = "MODULATION"
pages = [49]
description = "A phase-shifted sound is added to the original sound and modulated."

[[mfx.param]]
label = "Mode"
schema = ["mode"]
values = "4-STAGE, 8-STAGE, 12-STAGE"
meaning = "Number of stages in the phaser."

[[mfx.param]]
label = "Manual"
schema = ["manual"]
values = "0–127"
meaning = "Basic frequency from which the sound is modulated."
control = true

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]
values = "0.05–10.00 Hz"
meaning = "Frequency of modulation."
control = true

[[mfx.param]]
label = "Depth"
schema = ["depth"]
values = "0–127"
meaning = "Depth of modulation."

[[mfx.param]]
label = "Polarity"
schema = ["polarity"]
values = "INVERSE, SYNCHRO"
meaning = "INVERSE: left and right modulation phase opposite; spreads a mono source. SYNCHRO: same phase; select for a stereo source."

[[mfx.param]]
label = "Resonance"
schema = ["reso"]
values = "0–127"
meaning = "Amount of feedback."
control = true

[[mfx.param]]
label = "Cross Feedback"
schema = ["xfbk"]
values = "-98–+98%"
meaning = "Proportion of the phaser sound fed back into the effect; negative settings invert the phase."

[[mfx.param]]
label = "Mix"
schema = ["mix"]
values = "0–127"
meaning = "Level of the phase-shifted sound."
control = true

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high range."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."

[[mfx]]
number = 12
name = "STEP PHASER"
category = "MODULATION"
pages = [50]
description = "The phaser effect is varied in steps (stepwise change of the phaser effect at Step Rate)."
notes = ["The manual's one-line description reads 'The phaser effect will be varied gradually.'"]

[[mfx.param]]
label = "Mode"
schema = ["mode"]
values = "4-STAGE, 8-STAGE, 12-STAGE"
meaning = "Number of stages in the phaser."

[[mfx.param]]
label = "Manual"
schema = ["manual"]
values = "0–127"
meaning = "Basic frequency from which the sound is modulated."
control = true

[[mfx.param]]
label = "Rate"
schema = ["rateHz"]
values = "0.05–10.00 Hz"
meaning = "Frequency of modulation."
control = true

[[mfx.param]]
label = "Depth"
schema = ["depth"]
values = "0–127"
meaning = "Depth of modulation."

[[mfx.param]]
label = "Polarity"
schema = ["polarity"]
values = "INVERSE, SYNCHRO"
meaning = "INVERSE: left/right phase opposite (spreads a mono source). SYNCHRO: same phase (for a stereo source)."

[[mfx.param]]
label = "Resonance"
schema = ["reso"]
values = "0–127"
meaning = "Amount of feedback."
control = true

[[mfx.param]]
label = "Cross Feedback"
schema = ["xfbk"]
values = "-98–+98%"
meaning = "Proportion of the phaser sound fed back into the effect; negative inverts the phase."

[[mfx.param]]
label = "Step Rate"
schema = ["sRateHz"]
values = "0.10–20.00 Hz"
meaning = "Rate of the step-wise change in the phaser effect."
control = true

[[mfx.param]]
label = "Mix"
schema = ["mix"]
values = "0–127"
meaning = "Level of the phase-shifted sound."
control = true

[[mfx.param]]
label = "Low Gain / High Gain"
schema = ["eqLo", "eqHi"]
values = "-15–+15 dB"
meaning = "Gain of the low / high range."

[[mfx.param]]
label = "Level"
schema = ["level"]
values = "0–127"
meaning = "Output level."


# ================================================================== WINDS ==

[[recipe]]
id = "wind.flute"
name = "Orchestral flute"
family = "Brass/Poly Synth"
factory = ["Shakuhachi", "Pan Pipes", "Air Lead", "Soft Lead"]
waves = [99, 102, 185]
ss = [53, 54]
summary = """
The flute spectrum is capped around 2 kHz for every note (HPF at a few hundred Hz, LPF ~2 kHz, tracking only a few %). Pressure changes brightness, not loudness. Vibrato is 5-6 Hz brightness modulation. The amp attack is not instant, sustain is full, and the release is just long enough to avoid 'sucking' in legato. Reid finds added noise detracts. Reverb is essential."""
steps = [
  { ref = "tone.wave_number", set = "99 Flute (PCM) or saw 185 for synth flute", why = "" },
  { ref = "tone.filter_type", set = "LPF, cutoff ~60-75 (the 2 kHz region; calibrate by ear), resonance 15-30", why = "resonance adds edge without sounding electronic" },
  { ref = "tone.cutoff_kf", set = "+5...+15", why = "a fixed spectral ceiling" },
  { ref = "tone.aenv_times", set = "T1 10-20, T4 10-20", why = "" },
  { ref = "tone.lfo_depth_tvf", set = "small-moderate, rate ~5-6 Hz", why = "brightness vibrato" },
  { ref = "tone.lfo_depth_pitch", set = "0", why = "" },
  { ref = "tone.lfo_fade_mode", set = "ON-IN, short delay", why = "after the chiff" },
  { ref = "tone.cutoff_vel_sens", set = "+20", why = "" },
]
performance = [
  { ref = "matrix.source", set = "AFTERTOUCH -> CUTOFF + and LFO1 TVF DEPTH +", why = "blowing pressure = brightness" },
  { ref = "common.mono_poly", set = "MONO, legato ON, retrigger OFF", why = "" },
]
effects = [
  { ref = "mfx:1", set = "EQUALIZER low cut (few hundred Hz)", why = "the HPF part of the flute spectrum" },
  { ref = "reverb.type", set = "SRV HALL, generous", why = "the flute radiates from many holes" },
]
pitfalls = ["Pitch vibrato and tremolo sound wrong on flute.", "A velocity-to-level mapping that's too strong: flutes don't get much louder."]

[[recipe]]
id = "wind.pan_pipes"
name = "Pan pipes / pan flute"
family = "Brass/Poly Synth"
factory = ["Pan Pipes", "Shakuhachi", "BagShakuLead"]
waves = [100, 101, 214, 196, 228, 229, 232]
ss = [52]
summary = """
A stopped pipe gives odd harmonics only (triangle/square, mellow). Pitched, high-frequency breath noise tracks the note. A noisy chiff starts every note, and the tone swells in just after the chiff. Add small vibrato, filter modulation and inverted tremolo, plus bends, and a generous reverb."""
steps = [
  { ref = "wave:100", set = "Pan Flute PCM as the quick route", why = "" },
  { ref = "tone.wave_number", set = "synth: tone 1 214 triangle (or 196 square), LPF cutoff 50-65, cutoff_kf +50...+70", why = "mellow odd-harmonic tone" },
  { ref = "tone.delay_time", set = "tone 1 delay mode NORMAL, small time; TVA T1 15-25", why = "the tone swells in after the chiff" },
  { ref = "tone.filter_type", set = "tone 2 noise (232/228) BPF, cutoff_kf +100, resonance high, low sustained level", why = "pitched breath" },
  { ref = "tone.aenv_times", set = "tone 3 white noise LPF, T1 0, T3 5-10, L3 0", why = "the chiff" },
  { ref = "tone.lfo_depth_tva", set = "tone 1 small NEGATIVE while lfo_depth_tvf small positive", why = "inverted tremolo keeps the loudness steady" },
  { ref = "tone.aenv_t1_sens", set = "+", why = "velocity-sensitive attack" },
]
performance = [
  { ref = "common.legato_sw", set = "OFF (or retrigger ON)", why = "a chiff on every note" },
  { ref = "common.bend", set = "2", why = "pan pipe players bend a lot" },
  { ref = "matrix.source", set = "CC01 -> LFO1 PCH DEPTH", why = "" },
]
effects = [
  { ref = "reverb.type", set = "SRV HALL, generous", why = "" },
]
pitfalls = ["Plain square + independent noise sounds disassociated; the noise must be pitched and move with the note."]


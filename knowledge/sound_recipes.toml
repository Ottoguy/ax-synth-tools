[[recipe]]
id = "organ.drawbar"
name = "Tonewheel drawbar organ (unadorned)"
family = "Organ/Clavi"
factory = ["D-Bars 1", "D-Bars 2", "D-Bars 3", "D-Bars 4", "D-Bars 5", "VK Organ 1", "VK Organ 2", "Vintage Org 1"]
waves = [220, 30, 258, 259, 261, 249]
ss = [14, 55, 56]
summary = """
A Hammond is additive: sine partials at 16' (-12), 5 1/3' (+7), 8' (0), 4' (+12), 2 2/3' (+19), 2' (+24), 1 3/5' (+28), 1 1/3' (+31) and 1' (+36), with drawbar levels. 88 8000 000 = the classic punchy registration. Rectangular envelope, key-click, no velocity, precise tuning."""
steps = [
  { ref = "wave:220", set = "Sine on up to 4 tones (or organ PCM 30/258-281 for full registrations)", why = "" },
  { ref = "tone.coarse_tune", set = "per drawbar: -12, +7, 0, +12, +19, +24, +28, +31, +36", why = "footage to semitones" },
  { ref = "tone.fine_tune", set = "0 (exact)", why = "mistuning sounds wrong on organs" },
  { ref = "tone.level", set = "= drawbar levels (8 -> 127)", why = "" },

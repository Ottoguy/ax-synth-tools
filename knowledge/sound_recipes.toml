# AX-Synth sound-design recipes (instrument and sound archetypes)
#
# Distilled from Gordon Reid's "Synth Secrets" (SOS 1999-2004; digests in knowledge/sound-design/digests/),
# mapped onto the AX-Synth. Evidence: 'summary' = [3P] Synth Secrets reasoning (parts in 'ss');
# 'set' values and wave/factory choices = [I] starting points, not hardware-verified. Tune by ear.
# Format (validated by research/tools/build_knowledge.py; see knowledge/sound-design/README.md):
#   id, name, family (factory family or "other"), factory = [factory Tone names to start from],
#   waves = [PCM wave numbers], ss = [parts], summary,
#   steps / performance / effects = [{ref, set, why}], pitfalls = [text]
#   ref = KB id (param/group/concept) or "mfx:N" / "chorus:N" / "reverb:N" / "wave:N".
# Value notation: envelope times/levels 0-127; "L0..L4"/"T1..T4" as in the Editor; tone = one of the 4 layers.

# ================================================================== BRASS ==

[[recipe]]
id = "brass.synth"
name = "Analogue synth brass (Prophet/OB/Minimoog style)"
family = "Brass/Poly Synth"
factory = ["Analog Brass", "Juno Brass", "Poly Brass", "106 Brass", "80s Brass 1", "Brite SynBrs", "Soft SynBrs"]
waves = [185, 177, 174, 179]
ss = [24, 25, 26, 27]
summary = """
Brass has the full harmonic series, so use a sawtooth. The key cue is a filter that opens more slowly than the amplitude (the higher harmonics speak later), a brief overblown 'parp', a high sustain and a short release. Harder = brighter. Avoid instant attacks, heavy resonance, and square/pulse waves."""
steps = [
  { ref = "tone.wave_number", set = "saw (185 JP-8 Saw / 177 MG Saw HD)", why = "full harmonic series = brass" },
  { ref = "tone.filter_type", set = "LPF", why = "" },
  { ref = "tone.cutoff", set = "25-45 (fairly closed)", why = "the envelope opens it" },
  { ref = "tone.resonance", set = "10-25", why = "a slight bump only; more sounds electronic" },
  { ref = "tone.fenv_depth", set = "+35...+55", why = "" },
  { ref = "tone.fenv_times", set = "T1 40-65, T2 30-60, T3 40-70, T4 5-15", why = "filter attack slower than amp attack" },
  { ref = "tone.fenv_levels", set = "L0 0, L1 127, L2 100, L3 60-80, L4 0", why = "parp, then settle" },
  { ref = "tone.aenv_times", set = "T1 10-25, T2 20, T3 30, T4 5-15", why = "about a 100 ms attack, quick release" },
  { ref = "tone.aenv_levels", set = "L1 127, L2 115, L3 100-115", why = "" },
  { ref = "tone.aenv_t1_sens", set = "+20...+40", why = "harder = faster attack" },
  { ref = "tone.cutoff_kf", set = "+60...+90", why = "slightly under 1:1 tracking" },
  { ref = "tone.fenv_vel_sens", set = "+20...+40", why = "harder = brighter" },
  { ref = "tone.res_vel_sens", set = "+10", why = "louder = more upper-harmonic emphasis" },
  { ref = "tone.fine_tune", set = "tone 2 same wave +5...+8 cents", why = "a section/fat variant; single tone for solo" },
]
performance = [
  { ref = "matrix.source", set = "AFTERTOUCH -> CUTOFF +", why = "sustained brightness swell" },
  { ref = "matrix.destination", set = "CC01 -> LFO1 PCH DEPTH", why = "mod-bar vibrato" },
  { ref = "tone.lfo_fade_mode", set = "ON-IN, delay 40, fade 50, rate ~5 Hz, pitch depth small", why = "delayed vibrato" },
]
effects = [
  { ref = "chorus.type", set = "CHORUS, moderate", why = "ensemble brass" },
  { ref = "reverb.type", set = "SRV HALL", why = "" },
]
pitfalls = ["Instant attack or high resonance kills the brass illusion.", "A square/pulse wave sounds like a clarinet, not brass.", "The filter opening at the same speed as the amp sounds like a generic synth."]

[[recipe]]
id = "brass.trumpet_realistic"
name = "Realistic trumpet / flugelhorn"
family = "Brass/Poly Synth"
factory = ["Trumpeter", "Trumpet", "AX BrassSect", "Soft Brass"]
waves = [114, 297, 298, 299, 300, 113, 115]
ss = [24, 25, 26]
summary = """
Start from trumpet PCM (velocity layers p/mf/ff) and add what samples lack: brighter-when-louder dynamics, delayed small vibrato, brief growl at the attack, faint breath, mono legato, and a hall. Trumpet sits an octave above the keyboard's 8' feel."""
steps = [
  { ref = "tmt.velocity", set = "tone 1 wave 297 (p) vel 1-70, tone 2 wave 298 (mf) vel 60-110, tone 3 wave 299 (ff) vel 100-127, with fades", why = "velocity-switched timbre = dynamic brightness" },
  { ref = "tone.filter_type", set = "LPF2", why = "natural roll-off" },
  { ref = "tone.cutoff_vel_sens", set = "+20", why = "" },
  { ref = "tone.aenv_times", set = "keep T1 0 (sample attack), T4 5-15", why = "don't overwrite the PCM attack" },
  { ref = "tone.lfo_fade_mode", set = "ON-IN delay 40-60", why = "delayed vibrato" },
  { ref = "tone.lfo_depth_pitch", set = "small (2-5)", why = "subtle ~5 Hz vibrato" },
]
performance = [
  { ref = "common.mono_poly", set = "MONO", why = "solo line" },
  { ref = "common.legato_retrigger", set = "OFF", why = "valve legato (Editor manual recommends OFF for wind phrases)" },
  { ref = "common.bend", set = "up 2 / down 2", why = "lip bends and falls" },
  { ref = "matrix.source", set = "AFTERTOUCH -> CUTOFF and LFO1 TVF DEPTH", why = "overblown brightness/growl" },
]
effects = [
  { ref = "reverb.type", set = "SRV HALL", why = "" },
  { ref = "chorus.level", set = "0", why = "a solo trumpet isn't a section" },
]
pitfalls = ["Vibrato from the first instant sounds synthetic.", "Too much pitch vibrato depth sounds electronic."]

[[recipe]]
id = "brass.spit_swell"
name = "Spit / swell brass (sforzando)"
family = "Brass/Poly Synth"
factory = ["Brite SynBrs", "Wide SynBrs", "Octa Brass", "Alpha Spit"]
waves = [185, 177, 118]
ss = [8, 25, 63]
summary = """
Silence, then a fast 'psst' spike, a drop to a much lower and duller level, a slow swell to full volume and brightness, then a quick release. It needs multi-level envelopes, which the AX-Synth TVA/TVF envelopes provide."""
steps = [
  { ref = "tone.aenv_times", set = "T1 0-5, T2 10-20, T3 60-90, T4 10-25", why = "spike, dip, swell" },
  { ref = "tone.aenv_levels", set = "L1 110-127, L2 50-70, L3 127", why = "L1 is not the max of the swell; L2 is the dip" },
  { ref = "tone.fenv_levels", set = "same shape as TVA (L1 high, L2 low, L3 high)", why = "brightness follows loudness" },
  { ref = "tone.fenv_depth", set = "+40", why = "" },
]
performance = [
  { ref = "common.offset_attack", set = "use as a swell-speed macro", why = "" },
]
effects = [
  { ref = "reverb.type", set = "SRV HALL", why = "" },
]
pitfalls = ["A plain ADSR can't make this shape; use L1/L2/L3."]

[[recipe]]
id = "brass.tuba_low"
name = "Tuba / low brass"
family = "Brass/Poly Synth"
factory = ["Trombone", "Soft Brass", "Analog Brass"]
waves = [177, 196, 185]
ss = [26, 27, 51]
summary = """
Low brass is more forgiving. The SH101 trick: saw plus a square an octave down gives body (the saw alone lacks body, the square alone is hollow). A noise-roughened filter (not pitch modulation) adds rasp. Play 1-2 octaves down."""
steps = [
  { ref = "tone.wave_number", set = "tone 1 177 MG Saw HD; tone 2 196 Fat Square", why = "the waveform mix defines the timbre" },
  { ref = "tone.coarse_tune", set = "tone 2 -12; whole patch -12 or -24 for tuba", why = "" },
  { ref = "tone.level", set = "tone 1 ~75 %, tone 2 ~100 %", why = "per the SH101 mixer" },
  { ref = "tone.cutoff", set = "20-35 + filter env +40", why = "" },
  { ref = "tone.lfo_waveform", set = "RND, fast, small TVF depth, ON-OUT fade", why = "noise-like rasp at the note start" },
]
performance = [
  { ref = "matrix.source", set = "AFTERTOUCH -> CUTOFF (pressure brass, silent until pressed if base cutoff ~0)", why = "SS51 filter-gated brass" },
]
effects = [
  { ref = "reverb.type", set = "SRV HALL", why = "" },
]
pitfalls = []


  { ref = "tone.aenv_levels", set = "L1 127, L2/L3 105-115", why = "slight bump" },
  { ref = "tone.lfo_fade_mode", set = "ON-IN, delay 30-50, fade 30-60", why = "delayed vibrato" },
  { ref = "tone.lfo_depth_pitch", set = "moderate (up to a quarter tone)", why = "finger vibrato 5-8 Hz" },
  { ref = "tone.lfo_depth_tva", set = "small", why = "body-induced tremolo" },
  { ref = "tone.random_pitch", set = "5-10 cents", why = "pitch hunting" },
]
performance = [
  { ref = "common.mono_poly", set = "MONO, legato ON, retrigger OFF", why = "" },
  { ref = "common.portamento_time", set = "5-15 (just off zero), mode LEGATO", why = "fingered glide" },
  { ref = "matrix.source", set = "AFTERTOUCH (or CC01 / D-Beam CC) -> LEVEL + and LFO1 PCH DEPTH +; low base tone.level", why = "the SS50/51 lesson: hand-controlled bowing" },

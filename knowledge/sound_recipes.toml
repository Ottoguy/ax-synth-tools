[[recipe]]
id = "strings.string_machine"
name = "String machine / ensemble pad (Solina, Omni, Logan)"
family = "Strings/Pad"
factory = ["Tape Strings", "Synth Str 1", "Synth Str 2", "JX Strings", "JP Strings", "106 Strings", "Sawtooth Str", "OB Strings", "Chorus Pad"]
waves = [185, 174, 121, 124, 125, 126]
ss = [20, 46, 47, 62]
summary = """
Two saws, minimal detune, a subtle vibrato on only one of them (or small random modulation), no velocity, a filter about half closed with moderate tracking and no envelope, a trapezoid amp envelope, then chorus/ensemble for the sheen."""
steps = [
  { ref = "tone.wave_number", set = "tones 1+2 saw (185 or 174)", why = "" },
  { ref = "tone.fine_tune", set = "tone 2 +4...+8", why = "small detune = thickening" },
  { ref = "tone.lfo_depth_pitch", set = "tone 1 only, tiny; TRI or RND; rate distinct from the beat", why = "the detune itself wobbles" },
  { ref = "common.analog_feel", set = "20-40", why = "" },
  { ref = "tone.filter_type", set = "LPF", why = "" },
  { ref = "tone.cutoff", set = "60-75", why = "half closed" },
  { ref = "tone.cutoff_kf", set = "+30...+50", why = "" },
  { ref = "tone.fenv_depth", set = "0", why = "string machines had no filter sweep" },
  { ref = "tone.tva_vel_curve", set = "FIX", why = "not velocity-sensitive" },
  { ref = "tone.aenv_times", set = "T1 40-70, T4 50-80", why = "trapezoid: crescendo + long tail" },
  { ref = "tone.aenv_levels", set = "L1-L3 127", why = "" },
]
performance = [
  { ref = "tone.coarse_tune", set = "optional tone 3 -12", why = "weight / cello register" },
]
effects = [
  { ref = "mfx:28", set = "SPACE-D or 26 HEXA-CHORUS", why = "ensemble sheen" },
  { ref = "chorus.type", set = "CHORUS", why = "" },
  { ref = "reverb.type", set = "SRV HALL", why = "" },
]
pitfalls = ["Large detune sounds honky-tonk.", "Identical regular modulation on both tones = plain vibrato, not ensemble."]


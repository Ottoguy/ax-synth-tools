[[param]]
id = "tone.aenv_time_kf"
group = "tone.tva_env"
label = "TIME KF (Time Keyfollow)"
schema = ["fm.pat.tone[].tvaEnvTimeKeyfollow"]
values = "-100–+100"
meaning = "Makes TVA envelope times T2–T4 depend on key position; relative to C4, positive = shorter times for higher notes, negative = longer; larger = more change."

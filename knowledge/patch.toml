# AX-Synth knowledge base: PATCH parameters (Common, Structure/TMT, Tone 1-4,
# Matrix Control, effect routing and effect units). Source: AX-Synth Editor manual
# (EM) unless doc says otherwise. Format: knowledge/README.md.
#
# schema paths: "fm.pat.tone[]" = each of the 4 tones; "x[]" = each array element
# (LFO1/LFO2, TMT tones 1-4). matrix = Matrix Control DESTINATION name that can
# modulate the parameter (EM p.42; linked by name because the manual's marker symbol
# was lost in text extraction).

# ---------------------------------------------------------------- COMMON ----
[[group]]
id = "common"
title = "PATCH COMMON"
doc = "EM"
pages = [20, 24, 25]
text = "Settings that apply to the whole patch (all four tones)."

[[param]]
id = "common.name"
group = "common"
label = "PATCH NAME"
schema = ["fm.pat.common.patchName"]
values = "12 characters (ASCII 32–127)"
meaning = "Patch name. Allowed characters: space ! \" # $ % & ' ( ) * + , - . / 0-9 : ; < = > ? @ A-Z [ \\ ] ^ _ ` a-z { | } ~ (EM p.5)."
doc = "EM"
pages = [24, 5]

[[param]]
id = "common.category"
group = "common"
label = "Patch Category"
schema = ["fm.pat.common.patchCategory"]
values = "0–127"
meaning = "Category number of the patch (used by the Editor's patch list)."
notes = ["Not described in the Editor manual; listed in the MIDI Implementation only.", "[F] The factory patches (user backup, research/generated/user-patches.csv) group by instrument: 1 ac. piano, 2 el. piano, 3 keyboards/clav, 4 bell, 5 mallet, 6 organ, 7 accordion, 8 harmonica, 9 ac. guitar, 10 el. guitar, 11 dist. guitar, 12 bass, 13 synth bass, 14 strings, 19 ac. brass, 20 synth brass, 21 sax, 22 hard lead, 23 soft lead, 24 techno synth, 25 pulsating, 27 other synth, 28 bright pad, 29 soft pad, 30 vox, 31 plucked, 32 ethnic.", "[3P/I] These names are Roland's XV/Fantom category list, which fits every observed group; the names themselves are unverified. Set the category to match the sound (the Editor's patch list uses it)."]
doc = "MI"
pages = [8]

[[param]]
id = "common.level"
group = "common"
label = "LEVEL"
schema = ["fm.pat.common.patchLevel"]
values = "0–127"
meaning = "Volume of the patch."
doc = "EM"
pages = [20, 24]

[[param]]
id = "common.pan"
group = "common"
label = "PAN"
schema = ["fm.pat.common.patchPan"]
values = "L64–0–63R"
meaning = "Left/right position of the patch."
doc = "EM"
pages = [24]

[[param]]
id = "common.output_assign"
group = "common"
label = "OUTPUT ASSIGN (PATCH OUTPUT ASSIGN)"
schema = ["fm.pat.common.patchOutputAssign"]
values = "MFX, L+R, L, R, TONE"
meaning = "How the direct (unprocessed) sound of the patch is output. MFX: in stereo through the multi-effect (chorus and reverb can also be applied after it). L+R: in stereo to the OUTPUT jacks without passing through the MFX. L: in mono to OUTPUT L without the MFX. R: in mono to OUTPUT R without the MFX. TONE: according to each tone's own OUTPUT ASSIGN."
notes = ["[F] Legal stored values are 0, 1, 5, 6, 13 (numberTable outputAssignXV5050Table) = MFX, L+R, L, R, TONE."]
doc = "EM"
pages = [15, 24]

[[param]]
id = "common.octave_shift"
group = "common"
label = "OCTAVE SHIFT"
schema = ["fm.pat.common.octaveShift"]
values = "-3–+3"
meaning = "Pitch of the patch's sound in octaves."
doc = "EM"
pages = [24]

[[param]]
id = "common.coarse_tune"
group = "common"
label = "TUNE COARSE"
schema = ["fm.pat.common.patchCoarseTune"]
values = "-48–+48"
meaning = "Pitch of the patch's sound in semitones (±4 octaves)."
doc = "EM"
pages = [24]

[[param]]
id = "common.fine_tune"
group = "common"
label = "TUNE FINE"
schema = ["fm.pat.common.patchFineTune"]
values = "-50–+50"
meaning = "Pitch of the patch's sound in 1-cent steps (1 cent = 1/100 semitone)."
doc = "EM"
pages = [24]

[[param]]
id = "common.stretch_tune"
group = "common"
label = "STRETCH TUNE DEPTH"
schema = ["fm.pat.common.stretchTuneDepth"]
values = "OFF, 1–3"
meaning = "Stretched tuning, the way acoustic pianos are normally tuned: the low range lower and the high range higher than mathematical tuning. OFF: equal temperament. 1–3: higher settings give a greater pitch difference between low and high ranges."
doc = "EM"
pages = [24]

[[group]]
id = "common.bend"
title = "Pitch bend range"
doc = "EM"
pages = [24]
text = "Range of the TOUCH CONTROLLER ribbon (pitch bend)."

[[param]]
id = "common.bend_up"
group = "common.bend"
label = "PITCH BEND RANGE UP"
schema = ["fm.pat.common.pitchBendRangeUp"]
values = "0–+48"
meaning = "Pitch change in semitones when the touch controller is all the way right."
doc = "EM"
pages = [24]

[[param]]
id = "common.bend_down"
group = "common.bend"
label = "PITCH BEND RANGE DOWN"
schema = ["fm.pat.common.pitchBendRangeDown"]
values = "-48–0"
meaning = "Pitch change in semitones when the touch controller is all the way left."
notes = ["[F] Stored as a positive number of semitones (e.g. 24 = -24)."]
doc = "EM"
pages = [24]

[[group]]
id = "common.offset"
title = "OFFSET (Modify): patch-wide offsets applied to all tones"
doc = "EM"
pages = [25]
text = "Offsets that modify the corresponding per-tone parameters of all tones at once. Stored 1–127 with 64 = 0 [D MI]. [I] Natural candidates for simplified 'big knob' controls."

[[param]]
id = "common.offset_cutoff"
group = "common.offset"
label = "OFFSET CUTOFF"
schema = ["fm.pat.common.cutoffOffset"]
values = "-63–+63"
meaning = "Offset applied to the tones' TVF CUTOFF."
doc = "EM"
pages = [25]

[[param]]
id = "common.offset_resonance"
group = "common.offset"
label = "OFFSET RES (Resonance)"
schema = ["fm.pat.common.resonanceOffset"]
values = "-63–+63"
meaning = "Offset applied to the tones' TVF RES (resonance)."
doc = "EM"
pages = [25]

[[param]]
id = "common.offset_attack"
group = "common.offset"
label = "OFFSET ATTACK TIME"
schema = ["fm.pat.common.attackTimeOffset"]
values = "-63–+63"
meaning = "Offset applied to TVF Envelope Time 1 and TVA Envelope Time 1 (attack)."
doc = "EM"
pages = [25]

[[param]]
id = "common.offset_release"
group = "common.offset"
label = "OFFSET RELEASE TIME"
schema = ["fm.pat.common.releaseTimeOffset"]
values = "-63–+63"
meaning = "Offset applied to TVF Envelope Time 4 and TVA Envelope Time 4 (release)."
doc = "EM"
pages = [25]

[[param]]
id = "common.offset_velocity"
group = "common.offset"
label = "OFFSET VELOCITY SENS"
schema = ["fm.pat.common.velocitySensOffset"]
values = "-63–+63"
meaning = "Offset applied to TVF Cutoff Velocity Sens and TVA VEL SENS (velocity sensitivity)."
doc = "EM"
pages = [25]

[[param]]
id = "common.priority"
group = "common"
label = "PRIORITY"
schema = ["fm.pat.common.patchPriority"]
values = "LAST, LOUDEST"
meaning = "How notes are managed when maximum polyphony (128 voices) is exceeded. LAST: the last-played voices get priority (notes are turned off beginning with the first-played). LOUDEST: the loudest voices get priority (the lowest-volume voice is turned off first). Usually LAST."
doc = "EM"
pages = [10, 25]

[[param]]
id = "common.mono_poly"
group = "common"
label = "MONO/POLY"
schema = ["fm.pat.common.monoPoly"]
values = "MONO, POLY"
meaning = "MONO: only the last-played note sounds; effective for solo instrument patches such as sax or flute. POLY: two or more notes can be played simultaneously."
doc = "EM"
pages = [20, 25]

[[param]]
id = "common.legato_sw"
group = "common"
label = "LEGATO SW (Switch)"
schema = ["fm.pat.common.legatoSwitch"]
values = "OFF, ON"
meaning = "Whether the Legato Switch is used. Valid only with MONO. When ON, pressing a key while still holding a previous key changes the pitch to the newest key while the note keeps sounding: a smooth transition that simulates a guitarist's hammer-on/pull-off."
notes = ["EM caution: with LEGATO SW ON and RETRIGGER OFF, a legato to a higher key may not reach the intended pitch (stops at an intermediate pitch) because the wave-level pitch-rise limit is exceeded; with multiple tones using waves with different upper limits the patch may stop being heard in MONO. For large pitch changes set LEGATO RETRIGGER ON."]
doc = "EM"
pages = [25]

[[param]]
id = "common.legato_retrigger"
group = "common"
label = "LEGATO RETRIGGER"
schema = ["fm.pat.common.legatoRetrigger"]
values = "OFF, ON"
meaning = "Whether sounds are replayed (ON) or not (OFF) when playing legato. Valid when MONO and LEGATO SW ON. Normally ON. When OFF, holding one key and pressing another changes only the pitch, without playing the new key's attack; set OFF for wind and string phrases or when using modulation with a mono synth keyboard sound."
doc = "EM"
pages = [25]

[[param]]
id = "common.analog_feel"
group = "common"
label = "ANALOG FEEL"
schema = ["fm.pat.common.analogFeel"]
values = "0–127"
meaning = "Depth of 1/f modulation (a pleasant, naturally occurring modulation ratio, like a babbling brook or rustling wind). Simulates the natural instability of an analog synthesizer."
doc = "EM"
pages = [25]

[[group]]
id = "common.portamento"
title = "PORTAMENTO"
doc = "EM"
pages = [20, 26]
text = "Portamento smoothly changes the pitch from the first-played key to the next-played key."

[[param]]
id = "common.portamento_sw"
group = "common.portamento"
label = "PORTAMENTO SW"
schema = ["fm.pat.common.portamentoSwitch"]
values = "OFF, ON"
meaning = "Whether the portamento effect is applied."
notes = ["[D OM p.24] The panel [PORTAMENTO] button switches portamento on/off for regular patches."]
doc = "EM"
pages = [20, 26]

[[param]]
id = "common.portamento_mode"
group = "common.portamento"
label = "PORTAMENTO MODE"
schema = ["fm.pat.common.portamentoMode"]
values = "NORMAL, LEGATO"
meaning = "NORMAL: portamento is always applied. LEGATO: portamento is applied only when you play legato."
doc = "EM"
pages = [26]

[[param]]
id = "common.portamento_type"
group = "common.portamento"
label = "PORTAMENTO TYPE"
schema = ["fm.pat.common.portamentoType"]
values = "RATE, TIME"
meaning = "RATE: uniform speed of pitch change (the time taken corresponds to the pitch distance). TIME: constant time regardless of how far apart the notes are."
doc = "EM"
pages = [26]

[[param]]
id = "common.portamento_start"
group = "common.portamento"
label = "PORTAMENTO START"
schema = ["fm.pat.common.portamentoStart"]
values = "PITCH, NOTE"
meaning = "PITCH: a new portamento starts from the current (moving) pitch when another key is pressed during a glide. NOTE: the new portamento begins from the pitch where the current change would have ended."
doc = "EM"
pages = [26]

[[param]]
id = "common.portamento_time"
group = "common.portamento"
label = "PORTAMENTO TIME"
schema = ["fm.pat.common.portamentoTime"]
values = "0–127"
meaning = "Time over which the pitch changes."
doc = "EM"
pages = [20, 26]

# --------------------------------------------------------- STRUCTURE / TMT --
[[group]]
id = "tmt.structure"
title = "STRUCTURE (tone pair connection) and BOOSTER"
doc = "EM"
pages = [27, 28]
text = "See concept structure.types for the 10 connection types."

[[param]]
id = "tmt.structure_12"
group = "tmt.structure"
label = "STRUCTURE TONE 1 & 2 TYPE"
schema = ["fm.pat.tmt.structureType12"]
values = "TYPE 1–10"
meaning = "How tones 1 and 2 are connected (independent, stacked filters, booster, ring modulator variants). See concept structure.types."
doc = "EM"
pages = [27]

[[param]]
id = "tmt.structure_34"
group = "tmt.structure"
label = "STRUCTURE TONE 3 & 4 TYPE"
schema = ["fm.pat.tmt.structureType34"]
values = "TYPE 1–10"
meaning = "How tones 3 and 4 are connected. See concept structure.types."
doc = "EM"
pages = [27]

[[param]]
id = "tmt.booster_12"
group = "tmt.structure"
label = "BOOSTER (TONE 1 & 2)"
schema = ["fm.pat.tmt.booster12"]
values = "0, +6, +12, +18 (dB)"
meaning = "Amount of boost applied when the Structure Type is 03 or 04. The booster distorts the sound by boosting the input signal (electric-guitar-style distortion); higher = stronger distortion."
related = ["structure.booster"]
doc = "EM"
pages = [28]

[[param]]
id = "tmt.booster_34"
group = "tmt.structure"
label = "BOOSTER (TONE 3 & 4)"
schema = ["fm.pat.tmt.booster34"]
values = "0, +6, +12, +18 (dB)"
meaning = "Same as BOOSTER for tones 3 & 4."
related = ["structure.booster"]
doc = "EM"
pages = [28]

[[param]]
id = "tmt.tone_switch"
group = "tmt.structure"
label = "TONE SWITCH (SW) 1–4"
schema = ["fm.pat.tmt.tmtToneSwitch[]"]
values = "OFF, ON"
meaning = "Turns each of the four tones on (heard) or off (silent). Turning off unneeded tones conserves polyphony."
doc = "EM"
pages = [18]

[[group]]
id = "tmt.velocity"
title = "VELOCITY RANGE (TMT)"
doc = "EM"
pages = [40]
text = "Per tone: which velocities make the tone sound; see concept tmt.overview."

[[param]]
id = "tmt.velocity_control"
group = "tmt.velocity"
label = "VELOCITY CONTROL"
schema = ["fm.pat.tmt.tmtVelocityControl"]
values = "OFF, ON, RANDOM, CYCLE"
meaning = "Whether a different tone is played depending on velocity (ON) or not (OFF). RANDOM: the patch's tones sound randomly regardless of velocity. CYCLE: the tones sound consecutively regardless of velocity. Set OFF when using Matrix Control to switch tones."
doc = "EM"
pages = [40]

[[param]]
id = "tmt.control_sw"
group = "tmt.velocity"
label = "TMT CONTROL SW"
schema = ["fm.pat.common.tmtControlSwitch"]
values = "OFF, ON"
meaning = "Use the Matrix Control (destination TMT) to enable (ON) or disable (OFF) sounding of different tones."
doc = "EM"
pages = [40]

[[param]]
id = "tmt.velo_fade_lower"
group = "tmt.velocity"
label = "VELOCITY FADE LOWER"
schema = ["fm.pat.tmt.tmtVelocityFadeWidthLower[]"]
values = "0–127"
meaning = "What happens to the tone's level when played at a velocity lower than Velocity Range Lower (a fade). Set 0 if the tone should not sound at all below the range."
doc = "EM"
pages = [40]

[[param]]
id = "tmt.velo_lower"
group = "tmt.velocity"
label = "VELOCITY RANGE LOWER"
schema = ["fm.pat.tmt.tmtVelocityRangeLower[]"]
values = "1–(UPPER)"
meaning = "Lowest velocity at which the tone sounds."
matrix = "TMT"
doc = "EM"
pages = [40]

[[param]]
id = "tmt.velo_upper"
group = "tmt.velocity"
label = "VELOCITY RANGE UPPER"
schema = ["fm.pat.tmt.tmtVelocityRangeUpper[]"]
values = "(LOWER)–127"
meaning = "Highest velocity at which the tone sounds."
matrix = "TMT"
doc = "EM"
pages = [40]

[[param]]
id = "tmt.velo_fade_upper"
group = "tmt.velocity"
label = "VELOCITY FADE UPPER"
schema = ["fm.pat.tmt.tmtVelocityFadeWidthUpper[]"]
values = "0–127"
meaning = "What happens to the tone's level when played at a velocity greater than Velocity Range Upper. Set 0 if the tone should not sound at all above the range."
doc = "EM"
pages = [40]

[[group]]
id = "tmt.key"
title = "KEY RANGE (TMT)"
doc = "EM"
pages = [41]
text = "Per tone: which notes make the tone sound (keyboard split/layer)."

[[param]]
id = "tmt.key_fade_lower"
group = "tmt.key"
label = "KEY FADE LOWER"
schema = ["fm.pat.tmt.tmtKeyboardFadeWidthLower[]"]
values = "0–127"
meaning = "What happens to the tone's level when a note lower than Key Range Lower is played. Set 0 if the tone should not sound at all."
doc = "EM"
pages = [41]

[[param]]
id = "tmt.key_lower"
group = "tmt.key"
label = "KEY RANGE LOWER"
schema = ["fm.pat.tmt.tmtKeyboardRangeLower[]"]
values = "C-1–(UPPER)"
meaning = "Lowest note at which the tone sounds."
doc = "EM"
pages = [41]

[[param]]
id = "tmt.key_upper"
group = "tmt.key"
label = "KEY RANGE UPPER"
schema = ["fm.pat.tmt.tmtKeyboardRangeUpper[]"]
values = "(LOWER)–G9"
meaning = "Highest note at which the tone sounds."
doc = "EM"
pages = [41]

[[param]]
id = "tmt.key_fade_upper"
group = "tmt.key"
label = "KEY FADE UPPER"
schema = ["fm.pat.tmt.tmtKeyboardFadeWidthUpper[]"]
values = "0–127"
meaning = "What happens to the tone's level when a note higher than Key Range Upper is played. Set 0 if the tone should not sound at all."
doc = "EM"
pages = [41]

# ------------------------------------------------------------------- WG -----
[[group]]
id = "tone.wg"
title = "WG (Wave Generator): waveform and pitch"
doc = "EM"
pages = [21, 29]
text = "Per tone. Modifies waveform, pitch and pitch envelope."

[[param]]
id = "tone.wave_group"
group = "tone.wg"
label = "Wave Group Type / Wave Group ID"
schema = ["fm.pat.tone[].waveGroupType", "fm.pat.tone[].waveGroupID"]
values = "Type: ---, INT, ---, --- ; ID: OFF, 1–16384"
meaning = "Which wave bank the wave number refers to. Only INT (internal) exists on the AX-Synth."
notes = ["Not described in the Editor manual; from the MIDI Implementation."]
doc = "MI"
pages = [13]

[[param]]
id = "tone.wave_number"
group = "tone.wg"
label = "WAVE NUMBER L (Mono) / R"
schema = ["fm.pat.tone[].waveNumberL", "fm.pat.tone[].waveNumberR"]
values = "Off, 1–"
meaning = "Basic waveform of the tone. In mono only L is specified; in stereo R is also specified (select L first, then pick the matching R, whose number is L+1)."
notes = ["[F] Wave names: Script.xml stringTable internalWaveNameTableA (313 names); wave N probably = entry N-1 [I, strongly supported by the forum patches]."]
related = ["wave.stereo", "wave.oneshot_loop"]
doc = "EM"
pages = [21, 29, 19]

[[param]]
id = "tone.wave_gain"
group = "tone.wg"
label = "GAIN"
schema = ["fm.pat.tone[].waveGain"]
values = "-6, 0, +6, +12 (dB)"
meaning = "Gain (amplification) of the waveform in 6 dB steps; +6 dB doubles the gain. When using the Booster to distort the sound, set this to its maximum."
doc = "EM"
pages = [21, 29]

[[param]]
id = "tone.fxm_sw"
group = "tone.wg"
label = "FXM ON"
schema = ["fm.pat.tone[].waveFXMSwitch"]
values = "OFF, ON"
meaning = "Whether FXM (frequency cross modulation) is used."
related = ["wave.fxm"]
doc = "EM"
pages = [21, 29]

[[param]]
id = "tone.fxm_color"
group = "tone.wg"
label = "FXM COLOR"
schema = ["fm.pat.tone[].waveFXMColor"]
values = "1–4"
meaning = "How FXM performs frequency modulation: higher settings give a grainier sound, lower settings a more metallic sound."
doc = "EM"
pages = [21, 29]

[[param]]
id = "tone.fxm_depth"
group = "tone.wg"
label = "FXM DEPTH"
schema = ["fm.pat.tone[].waveFXMDepth"]
values = "0–16"
meaning = "Depth of the modulation produced by FXM."
matrix = "FXM DEPTH"
doc = "EM"
pages = [21, 29]

[[param]]
id = "tone.coarse_tune"
group = "tone.wg"
label = "TUNE COARSE"
schema = ["fm.pat.tone[].toneCoarseTune"]
values = "-48–+48"
meaning = "Pitch of the tone's sound in semitones (±4 octaves)."
matrix = "PITCH"
doc = "EM"
pages = [21, 29]

[[param]]
id = "tone.fine_tune"
group = "tone.wg"
label = "TUNE FINE"
schema = ["fm.pat.tone[].toneFineTune"]
values = "-50–+50"
meaning = "Pitch of the tone's sound in 1-cent steps (1/100 semitone)."
matrix = "PITCH"
doc = "EM"
pages = [21, 29]

[[param]]
id = "tone.random_pitch"
group = "tone.wg"
label = "RANDOM PITCH"
schema = ["fm.pat.tone[].toneRandomPitchDepth"]
values = "0–1200 (cents; stored as 31 steps: 0–10, 20–100 by 10, 200–1200 by 100)"
meaning = "Width of random pitch deviation each time a key is pressed. Set 0 for no random pitch change."
doc = "EM"
pages = [29]

[[param]]
id = "tone.pitch_kf"
group = "tone.wg"
label = "PITCH KF (Pitch Keyfollow)"
schema = ["fm.pat.tone[].wavePitchKeyfollow"]
values = "-200–+200"
meaning = "Amount of pitch change when you play a key one octave higher. +100: the pitch rises one octave per octave as on a conventional keyboard; +200: two octaves."
doc = "EM"
pages = [29]

# ------------------------------------------------------------- TONE DELAY ---
[[group]]
id = "tone.delay"
title = "TONE DELAY"
doc = "EM"
pages = [30]
text = "See concept tone.delay_modes."

[[param]]
id = "tone.delay_mode"
group = "tone.delay"
label = "TONE DELAY MODE"
schema = ["fm.pat.tone[].toneDelayMode"]
values = "NORMAL, HOLD, KEY-OFF-NOR, KEY-OFF-DCY"
meaning = "NORMAL: the tone begins after the delay time. HOLD: begins after the delay time, but if the key is released before the time has elapsed the tone is not played. KEY-OFF-NOR: the tone begins the delay time after the key is released instead of while it is held (e.g. simulating guitar noises). KEY-OFF-DCY: like KEY-OFF-NOR but the TVA envelope already runs while the key is held, so often only the release portion is heard. With a decaying (one-shot) wave, KEY-OFF modes may give no sound."
doc = "EM"
pages = [30]

[[param]]
id = "tone.delay_time"
group = "tone.delay"
label = "TONE DELAY TIME"
schema = ["fm.pat.tone[].toneDelayTime"]
values = "0–127"
meaning = "Time from key press (or, in KEY-OFF modes, from key release) until the tone sounds."
doc = "EM"
pages = [30]

# ----------------------------------------------------------- PITCH ENV ------
[[group]]
id = "tone.pitch_env"
title = "PITCH ENV (Wave Pitch Envelope)"
doc = "EM"
pages = [21, 31]
text = "Five levels L0–L4 joined by four times T1–T4; T1 starts at note-on, T4 is the release. Levels are relative to the pitch set by coarse/fine tune."

[[param]]
id = "tone.penv_depth"
group = "tone.pitch_env"
label = "DEPTH (PITCH ENV DEPTH)"
schema = ["fm.pat.tone[].pitchEnvDepth"]
values = "-12–+12"
meaning = "Depth of the pitch envelope. Higher settings produce greater change; negative settings invert the envelope's shape."
doc = "EM"
pages = [21, 31]

[[param]]
id = "tone.penv_time_kf"
group = "tone.pitch_env"
label = "TIME KF (Time Keyfollow)"
schema = ["fm.pat.tone[].pitchEnvTimeKeyFollow"]
values = "-100–+100"
meaning = "Makes pitch envelope times T2–T4 depend on key position. Relative to C4, positive settings make notes above C4 have increasingly shorter times."
doc = "EM"
pages = [31]

[[param]]
id = "tone.penv_vel_sens"
group = "tone.pitch_env"
label = "VEL SENS (Velocity Sens)"
schema = ["fm.pat.tone[].pitchEnvVelocitySens"]
values = "-63–+63"
meaning = "Lets keyboard dynamics control the pitch envelope depth; positive = more effect for strongly played notes."
doc = "EM"
pages = [31]

[[param]]
id = "tone.penv_t1_sens"
group = "tone.pitch_env"
label = "T1 SENS (T1 Velocity Sens)"
schema = ["fm.pat.tone[].pitchEnvTime1VelocitySens"]
values = "-63–+63"
meaning = "Lets keyboard dynamics affect T1; positive = T1 speeds up for strongly played notes."
doc = "EM"
pages = [31]

[[param]]
id = "tone.penv_t4_sens"
group = "tone.pitch_env"
label = "T4 SENS (T4 Velocity Sens)"
schema = ["fm.pat.tone[].pitchEnvTime4VelocitySens"]
values = "-63–+63"
meaning = "Lets key release speed affect T4; positive = T4 speeds up for quickly released notes."
doc = "EM"
pages = [31]

[[param]]
id = "tone.penv_times"
group = "tone.pitch_env"
label = "T1–T4 (Time 1–4)"
schema = ["fm.pat.tone[].pitchEnvTime1", "fm.pat.tone[].pitchEnvTime2", "fm.pat.tone[].pitchEnvTime3", "fm.pat.tone[].pitchEnvTime4"]
values = "0–127"
meaning = "Pitch envelope times; higher = longer time until the next pitch level is reached. Simplified controls: PITCH ENV A = T1, D = T3, R = T4."
matrix = "PCH ENV A-TIME (T1), PCH ENV D-TIME (T3), PCH ENV R-TIME (T4)"
doc = "EM"
pages = [21, 31]

[[param]]
id = "tone.penv_levels"
group = "tone.pitch_env"
label = "L0–L4 (Level 0–4)"
schema = ["fm.pat.tone[].pitchEnvLevel0", "fm.pat.tone[].pitchEnvLevel1", "fm.pat.tone[].pitchEnvLevel2", "fm.pat.tone[].pitchEnvLevel3", "fm.pat.tone[].pitchEnvLevel4"]
values = "-63–+63"
meaning = "Pitch envelope levels: how the pitch changes at each point relative to the pitch set by COARSE/FINE TUNE. Simplified control PITCH ENV S = L3."
doc = "EM"
pages = [21, 31]

# ------------------------------------------------------------------ TVF -----
[[group]]
id = "tone.tvf"
title = "TVF (filter)"
doc = "EM"
pages = [22, 32]
text = "A filter cuts or boosts a frequency region to change the sound's brightness, thickness or other qualities."

[[param]]
id = "tone.filter_type"
group = "tone.tvf"
label = "FILTER TYPE"
schema = ["fm.pat.tone[].tvfFilterType"]
values = "OFF, LPF, BPF, HPF, PKG, LPF2, LPF3"
meaning = "OFF: no filter. LPF (low pass): reduces all frequencies above the cutoff to round off / un-brighten the sound. BPF (band pass): leaves only frequencies around the cutoff; useful for distinctive sounds. HPF (high pass): cuts frequencies below the cutoff; suits percussive sounds emphasizing higher tones. PKG (peaking): emphasizes frequencies around the cutoff; with an LFO sweeping the cutoff gives wah-wah. LPF2: low pass with half the sensitivity of LPF; good for simulated instruments such as acoustic piano. LPF3: low pass whose sensitivity changes with the cutoff frequency; also for acoustic instruments, with a different nuance from LPF2 even with the same envelope. With LPF2/LPF3 the RES setting is ignored."
doc = "EM"
pages = [22, 32]

[[param]]
id = "tone.cutoff"
group = "tone.tvf"
label = "CUTOFF (Cutoff Frequency)"
schema = ["fm.pat.tone[].tvfCutoffFrequency"]
values = "0–127"
meaning = "Frequency at which the filter begins to affect the waveform's frequency components."
matrix = "CUTOFF"
doc = "EM"
pages = [22, 32]

[[param]]
id = "tone.resonance"
group = "tone.tvf"
label = "RES (Resonance)"
schema = ["fm.pat.tone[].tvfResonance"]
values = "0–127"
meaning = "Emphasizes the region around the cutoff frequency, adding character. Excessively high settings can produce oscillation, causing distortion."
matrix = "RESONANCE"
doc = "EM"
pages = [22, 32]

[[param]]
id = "tone.res_vel_sens"
group = "tone.tvf"
label = "RES VEL SENS (Resonance Velocity Sens)"
schema = ["fm.pat.tone[].tvfResonanceVelocitySens"]
values = "-63–+63"
meaning = "Lets velocity modify the resonance amount; positive = strongly played notes get more resonance."
doc = "EM"
pages = [32]

[[param]]
id = "tone.cutoff_kf"
group = "tone.tvf"
label = "CUTOFF KF (Cutoff Keyfollow)"
schema = ["fm.pat.tone[].tvfCutoffKeyfollow"]
values = "-200–+200"
meaning = "Makes the cutoff depend on the key played. Relative to C4, positive settings raise the cutoff for notes above C4, negative settings lower it; larger = more change."
doc = "EM"
pages = [32]

# ------------------------------------------------------------- TVF ENV ------
[[group]]
id = "tone.tvf_env"
title = "FILTER ENV (TVF Envelope) and cutoff velocity"
doc = "EM"
pages = [22, 33]
text = "Five levels L0–L4 joined by times T1–T4, relative to the CUTOFF value."

[[param]]
id = "tone.cutoff_vel_curve"
group = "tone.tvf_env"
label = "VEL CURVE (Cutoff Velocity Curve)"
schema = ["fm.pat.tone[].tvfCutoffVelocityCurve"]
values = "FIX, 1–7"
meaning = "Curve by which velocity affects the cutoff frequency. FIX: the cutoff is not affected by velocity."
doc = "EM"
pages = [33]

[[param]]
id = "tone.cutoff_vel_sens"
group = "tone.tvf_env"
label = "VEL SENS (Cutoff Velocity Sens)"
schema = ["fm.pat.tone[].tvfCutoffVelocitySens"]
values = "-63–+63"
meaning = "How playing velocity changes the cutoff; positive = strongly played notes raise the cutoff (brighter)."
doc = "EM"
pages = [33]

[[param]]
id = "tone.fenv_depth"
group = "tone.tvf_env"
label = "DEPTH (FILTER ENV DEPTH)"
schema = ["fm.pat.tone[].tvfEnvDepth"]
values = "-63–+63"
meaning = "Depth of the TVF envelope. Higher settings produce greater change; negative settings invert the envelope's shape."
doc = "EM"
pages = [22, 33]

[[param]]
id = "tone.fenv_time_kf"
group = "tone.tvf_env"
label = "TIME KF (Time Keyfollow)"
schema = ["fm.pat.tone[].tvfEnvTimeKeyfollow"]
values = "-100–+100"
meaning = "Makes TVF envelope times T2–T4 depend on key position; relative to C4, positive = shorter times for higher notes."
doc = "EM"
pages = [33]

[[param]]
id = "tone.fenv_vel_curve"
group = "tone.tvf_env"
label = "VEL CURVE (Velocity Curve)"
schema = ["fm.pat.tone[].tvfEnvVelocityCurve"]
values = "FIX, 1–7"
meaning = "Curve by which velocity affects the TVF envelope. FIX: the envelope is not affected by velocity."
doc = "EM"
pages = [33]

[[param]]
id = "tone.fenv_vel_sens"
group = "tone.tvf_env"
label = "VEL SENS (Velocity Sens)"
schema = ["fm.pat.tone[].tvfEnvVelocitySens"]
values = "-63–+63"
meaning = "How velocity affects the TVF envelope depth; positive = greater effect for strongly played notes, negative = less."
doc = "EM"
pages = [33]

[[param]]
id = "tone.fenv_t1_sens"
group = "tone.tvf_env"
label = "T1 SENS"
schema = ["fm.pat.tone[].tvfEnvTime1VelocitySens"]
values = "-63–+63"
meaning = "Lets keyboard dynamics affect T1 of the TVF envelope; positive = T1 speeds up for strongly played notes."
doc = "EM"
pages = [33]

[[param]]
id = "tone.fenv_t4_sens"
group = "tone.tvf_env"
label = "T4 SENS"
schema = ["fm.pat.tone[].tvfEnvTime4VelocitySens"]
values = "-63–+63"
meaning = "Lets key release speed affect T4 of the TVF envelope; positive = T4 speeds up for quickly released notes."
doc = "EM"
pages = [33]

[[param]]
id = "tone.fenv_times"
group = "tone.tvf_env"
label = "T1–T4 (Time 1–4)"
schema = ["fm.pat.tone[].tvfEnvTime1", "fm.pat.tone[].tvfEnvTime2", "fm.pat.tone[].tvfEnvTime3", "fm.pat.tone[].tvfEnvTime4"]
values = "0–127"
meaning = "TVF envelope times; higher = longer until the next cutoff level is reached. Simplified FILTER ENV A = T1, D = T3, R = T4. The patch OFFSET ATTACK/RELEASE TIME modifies T1/T4."
matrix = "TVF ENV A-TIME (T1), TVF ENV D-TIME (T3), TVF ENV R-TIME (T4)"
doc = "EM"
pages = [22, 33]

[[param]]
id = "tone.fenv_levels"
group = "tone.tvf_env"
label = "L0–L4 (Level 0–4)"
schema = ["fm.pat.tone[].tvfEnvLevel0", "fm.pat.tone[].tvfEnvLevel1", "fm.pat.tone[].tvfEnvLevel2", "fm.pat.tone[].tvfEnvLevel3", "fm.pat.tone[].tvfEnvLevel4"]
values = "0–127"
meaning = "TVF envelope levels: how the cutoff changes at each point relative to the CUTOFF value. Simplified FILTER ENV S = L3."
doc = "EM"
pages = [22, 33]

# ------------------------------------------------------------------ TVA -----
[[group]]
id = "tone.tva"
title = "TVA (amplifier): level, velocity, bias, pan"
doc = "EM"
pages = [23, 34, 35]
text = "TVA adjusts the volume and stereo position of the tone."

[[param]]
id = "tone.level"
group = "tone.tva"
label = "LEVEL"
schema = ["fm.pat.tone[].toneLevel"]
values = "0–127"
meaning = "Volume of the tone; mainly for adjusting the volume balance between tones."
matrix = "LEVEL"
doc = "EM"
pages = [23, 34]

[[param]]
id = "tone.tva_vel_curve"
group = "tone.tva"
label = "VEL CURVE (Velocity Curve)"
schema = ["fm.pat.tone[].tvaLevelVelocityCurve"]
values = "FIX, 1–7"
meaning = "Curve by which velocity affects the volume. FIX: the tone's volume is not affected by velocity."
doc = "EM"
pages = [34]

[[param]]
id = "tone.tva_vel_sens"
group = "tone.tva"
label = "VEL SENS (Velocity Sens)"
schema = ["fm.pat.tone[].tvaLevelVelocitySens"]
values = "-63–+63"
meaning = "How playing dynamics change the tone's volume; positive = louder the harder you play; negative = softer the harder you play."
doc = "EM"
pages = [34]

[[param]]
id = "tone.bias_level"
group = "tone.tva"
label = "BIAS LEVEL"
schema = ["fm.pat.tone[].biasLevel"]
values = "-100–+100"
meaning = "Bias makes the volume depend on keyboard position (useful for acoustic instruments). BIAS LEVEL is the angle of the volume change in the selected direction; larger = more change; negative inverts the direction."
doc = "EM"
pages = [34]

[[param]]
id = "tone.bias_position"
group = "tone.tva"
label = "BIAS POSITION"
schema = ["fm.pat.tone[].biasPosition"]
values = "C-1–G9"
meaning = "Key relative to which the volume is modified."
doc = "EM"
pages = [34]

[[param]]
id = "tone.bias_direction"
group = "tone.tva"
label = "BIAS DIRECTION"
schema = ["fm.pat.tone[].biasDirection"]
values = "LOWER, UPPER, LO&UP, ALL"
meaning = "LOWER: volume modified below the bias position. UPPER: above it. LO&UP: symmetrically on both sides. ALL: volume changes linearly with the bias position at the center."
doc = "EM"
pages = [34]

[[param]]
id = "tone.pan"
group = "tone.tva"
label = "PAN"
schema = ["fm.pat.tone[].tonePan"]
values = "L64–0–63R"
meaning = "Left/right position of the tone."
matrix = "PAN"
doc = "EM"
pages = [23, 35]

[[param]]
id = "tone.pan_kf"
group = "tone.tva"
label = "PAN KF (Pan Keyfollow)"
schema = ["fm.pat.tone[].tonePanKeyfollow"]
values = "-100–+100"
meaning = "Makes key position affect panning: positive = notes above C4 pan increasingly to the right; negative = to the left; larger = more change. With Structure TYPE 02–10 tone 1 (3) follows tone 2 (4)."
doc = "EM"
pages = [35]

[[param]]
id = "tone.random_pan"
group = "tone.tva"
label = "RANDOM PAN DEPTH"
schema = ["fm.pat.tone[].toneRandomPanDepth"]
values = "0–63"
meaning = "Stereo position changes randomly each time a key is pressed; higher = more change."
doc = "EM"
pages = [35]

[[param]]
id = "tone.alt_pan"
group = "tone.tva"
label = "ALT. PAN DEPTH (Alternate Pan Depth)"
schema = ["fm.pat.tone[].toneAlternatePanDepth"]
values = "L63–0–63R"
meaning = "Panning alternates between left and right each time a key is pressed; higher = more change. L or R reverses the alternation order: two tones set to L and R respectively alternate opposite to each other."
doc = "EM"
pages = [35]

# -------------------------------------------------------------- TVA ENV -----

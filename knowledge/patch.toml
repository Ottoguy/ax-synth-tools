pages = [36]

[[param]]
id = "tone.aenv_times"
group = "tone.tva_env"
label = "T1–T4 (Time 1–4)"
schema = ["fm.pat.tone[].tvaEnvTime1", "fm.pat.tone[].tvaEnvTime2", "fm.pat.tone[].tvaEnvTime3", "fm.pat.tone[].tvaEnvTime4"]
values = "0–127"
meaning = "TVA envelope times; higher = longer until the next volume level is reached. Simplified AMP ENV A = T1, D = T3, R = T4. The patch OFFSET ATTACK/RELEASE TIME modifies T1/T4."
matrix = "TVA ENV A-TIME (T1), TVA ENV D-TIME (T3), TVA ENV R-TIME (T4)"
doc = "EM"
pages = [23, 36]

[[param]]
id = "tone.aenv_levels"
group = "tone.tva_env"
label = "L1–L3 (Level 1–3)"
schema = ["fm.pat.tone[].tvaEnvLevel1", "fm.pat.tone[].tvaEnvLevel2", "fm.pat.tone[].tvaEnvLevel3"]
values = "0–127"
meaning = "TVA envelope levels: how the volume changes at each point relative to LEVEL. Simplified AMP ENV S = L3 (sustain level)."
doc = "EM"
pages = [23, 36]

# --------------------------------------------------------------- OUTPUT -----
[[group]]
id = "tone.output"
title = "Tone OUTPUT and send levels"
doc = "EM"
pages = [15, 23, 37]
text = "Where each tone's direct sound goes and how much of it is sent to chorus and reverb. Sounds are always sent to chorus and reverb in mono."

[[param]]
id = "tone.output_assign"
group = "tone.output"
label = "OUTPUT ASSIGN (TONE OUTPUT ASSIGN)"
schema = ["fm.pat.tone[].toneOutputAssign"]
values = "MFX, L+R, L, R"
meaning = "How the tone's direct sound is output. MFX: stereo through the multi-effect (chorus/reverb can follow). L+R: stereo to the OUTPUT jacks bypassing the MFX. L / R: mono to OUTPUT L / R bypassing the MFX. Valid only if PATCH OUTPUT ASSIGN is TONE. With Structure TYPE 02–10 tone 1 (3) follows tone 2 (4)."
notes = ["[F] Legal stored values 0, 1, 5, 6 (numberTable toneOutputAssignXV5050Table)."]
doc = "EM"
pages = [15, 37]

[[param]]
id = "tone.output_level"
group = "tone.output"
label = "SEND LEVEL OUT (Output Level / TONE OUTPUT LEVEL)"
schema = ["fm.pat.tone[].toneDrySendLevel"]
values = "0–127"
meaning = "Level of the tone's signal sent to the destination set by OUTPUT ASSIGN."
matrix = "OUTPUT LEVEL"
doc = "EM"
pages = [15, 23, 37]

[[param]]
id = "tone.chorus_send_mfx"
group = "tone.output"
label = "CHO (Chorus Send), OUTPUT ASSIGN = MFX"
schema = ["fm.pat.tone[].toneChorusSendLevelMFX"]
values = "0–127"
meaning = "Level sent to chorus for the tone when the tone goes through the MFX."
matrix = "CHORUS SEND"
doc = "EM"
pages = [23, 37]

[[param]]
id = "tone.reverb_send_mfx"
group = "tone.output"
label = "REV (Reverb Send), OUTPUT ASSIGN = MFX"
schema = ["fm.pat.tone[].toneReverbSendLevelMFX"]
values = "0–127"
meaning = "Level sent to reverb for the tone when the tone goes through the MFX."
matrix = "REVERB SEND"
doc = "EM"
pages = [23, 37]

[[param]]
id = "tone.chorus_send_direct"
group = "tone.output"
label = "CHO (Chorus Send), OUTPUT ASSIGN = non MFX"
schema = ["fm.pat.tone[].toneChorusSendLevelNonMFX"]
values = "0–127"
meaning = "Level sent to chorus for the tone when the tone does not go through the MFX."
matrix = "CHORUS SEND"
doc = "EM"
pages = [23, 37]

[[param]]
id = "tone.reverb_send_direct"
group = "tone.output"
label = "REV (Reverb Send), OUTPUT ASSIGN = non MFX"
schema = ["fm.pat.tone[].toneReverbSendLevelNonMFX"]
values = "0–127"
meaning = "Level sent to reverb for the tone when the tone does not go through the MFX."
matrix = "REVERB SEND"
notes = ["[D OM p.26] The on-device 'reU' (Reverb Send) edit changes a reverb send of regular patches and can only be saved to FAVORITE memories; which address it changes is unverified."]
doc = "EM"
pages = [23, 37]

# ------------------------------------------------------------------ LFO -----
[[group]]
id = "tone.lfo"
title = "LFO1 / LFO2"
doc = "EM"
pages = [20, 21, 37, 38, 39]
text = "Each tone has two LFOs with identical parameters. They cyclically change pitch (vibrato), cutoff (wah), volume (tremolo) and pan. Schema arrays: [0] = LFO1, [1] = LFO2. With Structure TYPE 02–10, tone 1 (3) follows tone 2 (4). See concept lfo.fade_modes."

[[param]]
id = "tone.lfo_waveform"
group = "tone.lfo"
label = "WAVEFORM"
schema = ["fm.pat.tone[].lfoWaveForm[]"]
values = "SIN, TRI, SAW-UP, SAW-DW, SQR, RND, BEND-UP, BEND-DW, TRP, S&H, CHS, VSIN, STEP"
meaning = "SIN sine; TRI triangle; SAW-UP sawtooth; SAW-DW sawtooth (negative polarity); SQR square; RND random; BEND-UP: once the attack of the LFO waveform has developed normally, it continues without further change; BEND-DW: once the decay has developed normally, it continues without further change; TRP trapezoid; S&H sample & hold (value changes once per cycle); CHS chaos; VSIN modified sine whose amplitude is randomly varied once each cycle; STEP: waveform generated from LFO STEP 1–16 (stepped change with a fixed pattern, like a step modulator). BEND-UP/BEND-DW require KEY TRIGGER ON, otherwise they have no effect."
doc = "EM"
pages = [20, 37]

[[param]]
id = "tone.lfo_rate"
group = "tone.lfo"
label = "RATE (RATE VALUE)"
schema = ["fm.pat.tone[].lfoRate[]"]
values = "0–127"
meaning = "Modulation speed of the LFO. Ignored when WAVEFORM is CHS."
matrix = "LFO1 RATE / LFO2 RATE"
doc = "EM"
pages = [20, 38]

[[param]]
id = "tone.lfo_offset"
group = "tone.lfo"
label = "OFFSET"
schema = ["fm.pat.tone[].lfoOffset[]"]
values = "-100, -50, 0, +50, +100"
meaning = "Raises or lowers the LFO waveform relative to the central value (pitch or cutoff). Positive: modulation occurs upward from the central value. Negative: downward."
doc = "EM"
pages = [38]

[[param]]
id = "tone.lfo_rate_detune"
group = "tone.lfo"
label = "RATE DETUNE"
schema = ["fm.pat.tone[].lfoRateDetune[]"]
values = "0–127"
meaning = "Subtly changes the LFO rate each time a key is pressed; higher = greater change."
doc = "EM"
pages = [38]

[[param]]
id = "tone.lfo_delay"
group = "tone.lfo"
label = "DELAY (DELAY TIME)"
schema = ["fm.pat.tone[].lfoDelayTime[]"]
values = "0–127"
meaning = "Time before the LFO effect is applied (or continues) after the key is pressed (or released), depending on FADE MODE. For violin, wind and similar sounds, adding vibrato only after the note has been drawn out can be effective."
doc = "EM"
pages = [21, 38]

[[param]]
id = "tone.lfo_delay_kf"
group = "tone.lfo"
label = "DELAY KEYFOLLOW (Delay Time Keyfollow)"
schema = ["fm.pat.tone[].lfoDelayTimeKeyfollow[]"]
values = "-100–+100"
meaning = "Adjusts DELAY TIME by key position relative to C4; positive = shorter delay for notes above C4."
doc = "EM"
pages = [38]

[[param]]
id = "tone.lfo_fade_mode"
group = "tone.lfo"
label = "FADE MODE"
schema = ["fm.pat.tone[].lfoFadeMode[]"]
values = "ON-IN, ON-OUT, OFF-IN, OFF-OUT"
meaning = "How the LFO is applied over time (fade in/out after key on/off). See concept lfo.fade_modes."
related = ["lfo.fade_modes"]
doc = "EM"
pages = [38, 39]

[[param]]
id = "tone.lfo_fade_time"
group = "tone.lfo"
label = "FADE TIME"
schema = ["fm.pat.tone[].lfoFadeTime[]"]
values = "0–127"
meaning = "Time over which the LFO amplitude reaches its maximum (or minimum), per FADE MODE."
doc = "EM"
pages = [38]

[[param]]
id = "tone.lfo_key_trigger"
group = "tone.lfo"
label = "KEY TRIGGER"
schema = ["fm.pat.tone[].lfoKeyTrigger[]"]
values = "OFF, ON"
meaning = "Whether the LFO cycle restarts in sync with each key press (ON) or free-runs (OFF). Required ON for BEND-UP/BEND-DW waveforms."
doc = "EM"
pages = [38]

[[param]]
id = "tone.lfo_depth_pitch"
group = "tone.lfo"
label = "DEPTH PITCH"
schema = ["fm.pat.tone[].lfoPitchDepth[]"]
values = "-63–+63"
meaning = "How deeply the LFO affects pitch (vibrato). Opposite signs on two tones give opposite modulation phase."
matrix = "LFO1 PCH DEPTH / LFO2 PCH DEPTH"
doc = "EM"
pages = [21, 38]

[[param]]
id = "tone.lfo_depth_tvf"
group = "tone.lfo"
label = "DEPTH TVF"
schema = ["fm.pat.tone[].lfoTvfDepth[]"]
values = "-63–+63"
meaning = "How deeply the LFO affects the cutoff frequency (wah)."
matrix = "LFO1 TVF DEPTH / LFO2 TVF DEPTH"
doc = "EM"
pages = [21, 38]

[[param]]
id = "tone.lfo_depth_tva"
group = "tone.lfo"
label = "DEPTH TVA"
schema = ["fm.pat.tone[].lfoTvaDepth[]"]
values = "-63–+63"
meaning = "How deeply the LFO affects the volume (tremolo)."
matrix = "LFO1 TVA DEPTH / LFO2 TVA DEPTH"
doc = "EM"
pages = [21, 38]

[[param]]
id = "tone.lfo_depth_pan"
group = "tone.lfo"
label = "DEPTH PAN"
schema = ["fm.pat.tone[].lfoPanDepth[]"]
values = "-63–+63"
meaning = "How deeply the LFO affects the pan (auto-pan)."
matrix = "LFO1 PAN DEPTH / LFO2 PAN DEPTH"
doc = "EM"
pages = [21, 38]

[[group]]
id = "tone.step_lfo"
title = "STEP LFO"
doc = "EM"
pages = [39]
text = "Data for LFO waveform STEP (one set per tone, shared by LFO1 and LFO2)."

[[param]]
id = "tone.step_type"
group = "tone.step_lfo"
label = "STEP TYPE"
schema = ["fm.pat.tone[].lfoStepType"]
values = "TYPE1, TYPE2"
meaning = "Whether the step LFO level changes abruptly at each step (TYPE1: stair-step) or is connected linearly (TYPE2: linear)."
doc = "EM"
pages = [39]

[[param]]
id = "tone.steps"
group = "tone.step_lfo"
label = "STEP 1–16"
schema = ["fm.pat.tone[].lfoStep1", "fm.pat.tone[].lfoStep2", "fm.pat.tone[].lfoStep3", "fm.pat.tone[].lfoStep4", "fm.pat.tone[].lfoStep5", "fm.pat.tone[].lfoStep6", "fm.pat.tone[].lfoStep7", "fm.pat.tone[].lfoStep8", "fm.pat.tone[].lfoStep9", "fm.pat.tone[].lfoStep10", "fm.pat.tone[].lfoStep11", "fm.pat.tone[].lfoStep12", "fm.pat.tone[].lfoStep13", "fm.pat.tone[].lfoStep14", "fm.pat.tone[].lfoStep15", "fm.pat.tone[].lfoStep16"]
values = "-36–+36"
meaning = "Step LFO data. With LFO PITCH DEPTH +63, each +1 unit of step data corresponds to +50 cents."
doc = "EM"
pages = [39]

# ------------------------------------------------------------ CONTROL SW ----
[[group]]
id = "tone.control_sw"
title = "CONTROL SW (per-tone MIDI reception and envelope mode)"
doc = "EM"
pages = [43]
text = "Per-tone switches for which MIDI messages affect the tone."

[[param]]
id = "tone.rcv_bender"
group = "tone.control_sw"
label = "RCV BENDER (Receive Bender)"
schema = ["fm.pat.tone[].toneReceiveBender"]
values = "OFF, ON"
meaning = "Whether this tone receives MIDI Pitch Bend."
doc = "EM"
pages = [43]

[[param]]
id = "tone.rcv_expression"
group = "tone.control_sw"
label = "RCV EXP (Receive Expression)"
schema = ["fm.pat.tone[].toneReceiveExpression"]
values = "OFF, ON"
meaning = "Whether this tone receives MIDI Expression (CC11)."
doc = "EM"
pages = [43]

[[param]]
id = "tone.rcv_hold"
group = "tone.control_sw"
label = "RCV HOLD-1 (Receive Hold-1)"
schema = ["fm.pat.tone[].toneReceiveHold-1"]
values = "OFF, ON"
meaning = "Whether this tone receives MIDI Hold-1 (CC64). No effect if ENV MODE is NO-SUS."
doc = "EM"
pages = [43]

[[param]]
id = "tone.redamper"
group = "tone.control_sw"
label = "REDAMPER"
schema = ["fm.pat.tone[].toneRedamperSwitch"]
values = "OFF, ON"
meaning = "Whether the sound is held when Hold 1 is received after a key is released but before the sound has decayed to silence; set ON to sustain. Effective for piano sounds. Requires RCV HOLD-1 ON."
doc = "EM"
pages = [43]

[[param]]
id = "tone.rcv_pan_mode"
group = "tone.control_sw"
label = "RCV PAN MODE (Receive Pan Mode)"
schema = ["fm.pat.tone[].toneReceivePanMode"]
values = "CONTINUOUS, KEY-ON"
meaning = "How Pan messages are received. CONTINUOUS: the stereo position changes whenever a Pan message arrives. KEY-ON: the pan changes only when the next note is played. Pan messages cannot be ignored entirely."
doc = "EM"
pages = [43]

[[param]]
id = "tone.env_mode"
group = "tone.control_sw"
label = "ENV MODE (Envelope Mode)"
schema = ["fm.pat.tone[].toneEnvMode"]
values = "NO-SUS, SUSTAIN"
meaning = "With a loop waveform the sound normally continues while the key is held; NO-SUS makes it decay naturally even with the key held. A one-shot wave does not sustain even with SUSTAIN."
related = ["wave.oneshot_loop"]
doc = "EM"
pages = [43]

# -------------------------------------------------------- MATRIX CONTROL ----
[[group]]
id = "common.matrix"
title = "MATRIX CONTROL 1–4"
doc = "EM"
pages = [41, 42]
text = "Four matrix controls per patch; each has one SOURCE and up to four DESTINATION/SENS pairs. See concept matrix.overview."

[[param]]
id = "matrix.source"
group = "common.matrix"
label = "SOURCE 1–4"
schema = ["fm.pat.common.matrixControl1Source", "fm.pat.common.matrixControl2Source", "fm.pat.common.matrixControl3Source", "fm.pat.common.matrixControl4Source"]
values = "OFF, CC01–31, CC33–95, PITCH BEND, AFTERTOUCH, VELOCITY, KEYFOLLOW, LFO1, LFO2, PITCH ENV, TVF ENV, TVA ENV"
meaning = "Message used to change tone parameters. OFF: not used. CC01–31, 33–95: controller numbers. PITCH BEND. AFTERTOUCH. VELOCITY: how hard the key is pressed. KEYFOLLOW: keyboard position with C4 = 0. LFO1, LFO2, PITCH ENV, TVF ENV, TVA ENV: internal modulators."
notes = ["[F] Stored index keeps a placeholder at 32, so raw value = CC number (raw 70 = CC70). The MIDI Implementation also lists unused slots ('---') between AFT and VELOCITY and between KEYFOLLOW and LFO1."]
doc = "EM"
pages = [41]

[[param]]
id = "matrix.destination"
group = "common.matrix"
label = "DESTINATION 1–4"
schema = ["fm.pat.common.matrixControl1Destination1", "fm.pat.common.matrixControl1Destination2", "fm.pat.common.matrixControl1Destination3", "fm.pat.common.matrixControl1Destination4", "fm.pat.common.matrixControl2Destination1", "fm.pat.common.matrixControl2Destination2", "fm.pat.common.matrixControl2Destination3", "fm.pat.common.matrixControl2Destination4", "fm.pat.common.matrixControl3Destination1", "fm.pat.common.matrixControl3Destination2", "fm.pat.common.matrixControl3Destination3", "fm.pat.common.matrixControl3Destination4", "fm.pat.common.matrixControl4Destination1", "fm.pat.common.matrixControl4Destination2", "fm.pat.common.matrixControl4Destination3", "fm.pat.common.matrixControl4Destination4"]
values = "OFF, PITCH, CUTOFF, RESONANCE, LEVEL, PAN, OUTPUT LEVEL, CHORUS SEND, REVERB SEND, LFO1/2 PCH DEPTH, LFO1/2 TVF DEPTH, LFO1/2 TVA DEPTH, LFO1/2 PAN DEPTH, LFO1/2 RATE, PCH ENV A-TIME, PCH ENV D-TIME, PCH ENV R-TIME, TVF ENV A-TIME, TVF ENV D-TIME, TVF ENV R-TIME, TVA ENV A-TIME, TVA ENV D-TIME, TVA ENV R-TIME, TMT, FXM DEPTH, MFX-CTRL1–4"
meaning = "Tone parameters controlled by the matrix control; up to four per matrix control, controlled simultaneously. MFX-CTRL1–4 route to the multi-effect control parameters. TMT switches tones (with TMT CONTROL SW ON)."
doc = "EM"
pages = [42]

[[param]]
id = "matrix.sens"
group = "common.matrix"
label = "SENS 1–4"
schema = ["fm.pat.common.matrixControl1Sens1", "fm.pat.common.matrixControl1Sens2", "fm.pat.common.matrixControl1Sens3", "fm.pat.common.matrixControl1Sens4", "fm.pat.common.matrixControl2Sens1", "fm.pat.common.matrixControl2Sens2", "fm.pat.common.matrixControl2Sens3", "fm.pat.common.matrixControl2Sens4", "fm.pat.common.matrixControl3Sens1", "fm.pat.common.matrixControl3Sens2", "fm.pat.common.matrixControl3Sens3", "fm.pat.common.matrixControl3Sens4", "fm.pat.common.matrixControl4Sens1", "fm.pat.common.matrixControl4Sens2", "fm.pat.common.matrixControl4Sens3", "fm.pat.common.matrixControl4Sens4"]
values = "-63–+63"
meaning = "Amount of the matrix control's effect. Positive: modifies the destination in the positive direction (higher, to the right, faster, ...) from its current setting; negative: in the negative direction. Larger absolute values = more change; 0 = no effect."
doc = "EM"
pages = [42]

[[param]]
id = "matrix.tone_switch"
group = "common.matrix"
label = "TONE 1–4 (Tone Switch 1–4)"
schema = ["fm.pat.tone[].toneControl1Switch1", "fm.pat.tone[].toneControl1Switch2", "fm.pat.tone[].toneControl1Switch3", "fm.pat.tone[].toneControl1Switch4", "fm.pat.tone[].toneControl2Switch1", "fm.pat.tone[].toneControl2Switch2", "fm.pat.tone[].toneControl2Switch3", "fm.pat.tone[].toneControl2Switch4", "fm.pat.tone[].toneControl3Switch1", "fm.pat.tone[].toneControl3Switch2", "fm.pat.tone[].toneControl3Switch3", "fm.pat.tone[].toneControl3Switch4", "fm.pat.tone[].toneControl4Switch1", "fm.pat.tone[].toneControl4Switch2", "fm.pat.tone[].toneControl4Switch3", "fm.pat.tone[].toneControl4Switch4"]
values = "OFF, ON, REV"
meaning = "Which tones the matrix control affects. OFF: not applied. ON: applied. REV: applied in reverse."
notes = ["[I] Storage is per tone: toneControl{c}Switch{d} in tone t is the switch for matrix control c, destination d, applied to tone t (the MIDI Implementation lists 'Tone Control c Switch d' inside each Patch Tone block)."]
doc = "EM"
pages = [42]

# ---------------------------------------------------- EFFECT ROUTING --------
[[group]]
id = "fx.routing"
title = "PATCH EFFECTS: ROUTING"
doc = "EM"
pages = [14, 15]
text = "One MFX, one chorus and one reverb per patch. Patch/tone OUTPUT ASSIGN and the tone send levels (tone.output group) decide what reaches which effect."

[[group]]
id = "fx.mfx"
title = "Multi-effect (MFX) settings"
doc = "EM"
pages = [15, 16]
text = "Type-specific parameters: knowledge/mfx.toml."

[[param]]
id = "mfx.type"
group = "fx.mfx"
label = "MFX TYPE"
schema = ["fm.pat.mfx.mfxType"]
values = "00: THROUGH – 78: SYMPATHETIC RESONANCE"
meaning = "Type of multi-effect. 00 THROUGH = no multi-effect. See knowledge/mfx.toml for the 78 types."
doc = "EM"
pages = [15, 16]

[[param]]
id = "mfx.output_level"
group = "fx.mfx"
label = "MFX OUTPUT LEVEL (SEND LEVEL OUT)"
schema = ["fm.pat.mfx.mfxDrySendLevel"]
values = "0–127"
meaning = "Volume of the sound processed by the multi-effect."
doc = "EM"
pages = [15, 16]

[[param]]
id = "mfx.chorus_send"
group = "fx.mfx"
label = "MFX CHORUS SEND LEVEL (CHO)"
schema = ["fm.pat.mfx.mfxChorusSendLevel"]
values = "0–127"
meaning = "Amount of chorus applied to the sound processed by the multi-effect."
doc = "EM"
pages = [15, 16]

[[param]]
id = "mfx.reverb_send"
group = "fx.mfx"
label = "MFX REVERB SEND LEVEL (REV)"
schema = ["fm.pat.mfx.mfxReverbSendLevel"]
values = "0–127"
meaning = "Amount of reverb applied to the sound processed by the multi-effect."
doc = "EM"
pages = [15, 16]

[[param]]
id = "mfx.output_assign"
group = "fx.mfx"
label = "MFX Output Assign"
schema = ["fm.pat.mfx.mfxOutputAssign"]
values = "A, ---, ---, ---"
meaning = "Output of the multi-effect. Only 'A' exists; the MIDI Implementation marks it as ignored on reception."
doc = "MI"
pages = [10]

[[group]]
id = "fx.mfx_control"
title = "MFX CONTROL (Multi-Effect Control 1–4)"
doc = "EM"
pages = [16]
text = "See concept mfx.control."

[[param]]
id = "mfx.control_source"
group = "fx.mfx_control"
label = "CONTROL SOURCE 1–4"
schema = ["fm.pat.mfx.mfxControl1Source", "fm.pat.mfx.mfxControl2Source", "fm.pat.mfx.mfxControl3Source", "fm.pat.mfx.mfxControl4Source"]
values = "OFF, CC01–31, CC33–95, PITCH BEND, AFTERTOUCH"
meaning = "MIDI message that controls the corresponding MFX control parameter. OFF: not used."
notes = ["[F] Same index rule as matrix source (raw = CC number, 97 = AFTERTOUCH)."]
doc = "EM"
pages = [16]

[[param]]
id = "mfx.control_destination"
group = "fx.mfx_control"
label = "DESTINATION 1–4"
schema = ["fm.pat.mfx.mfxControlAssign1", "fm.pat.mfx.mfxControlAssign2", "fm.pat.mfx.mfxControlAssign3", "fm.pat.mfx.mfxControlAssign4"]
values = "per MFX type (parameters marked '#' in knowledge/mfx.toml), OFF, 1–16"
meaning = "Which MFX parameter the CONTROL SOURCE controls. The selectable parameters depend on the MFX type."
notes = ["[F] Script.xml has a '<type>-destinationTable' string table per MFX type listing the destinations in index order."]
doc = "EM"
pages = [16]

[[param]]
id = "mfx.control_sens"
group = "fx.mfx_control"
label = "SENS 1–4"
schema = ["fm.pat.mfx.mfxControl1Sens", "fm.pat.mfx.mfxControl2Sens", "fm.pat.mfx.mfxControl3Sens", "fm.pat.mfx.mfxControl4Sens"]
values = "-63–+63"
meaning = "Depth of multi-effect control. Positive changes the destination in the positive direction (larger, toward the right, faster, ...), negative in the negative direction; larger values give more control."
doc = "EM"
pages = [16]

[[group]]
id = "fx.chorus"
title = "Chorus unit settings"
doc = "EM"
pages = [15, 17, 77]
text = "Type-specific parameters: knowledge/chorus_reverb.toml."

[[param]]
id = "chorus.type"
group = "fx.chorus"
label = "CHORUS TYPE"
schema = ["fm.pat.cho.chorusType"]
values = "OFF, CHORUS, DELAY"
meaning = "OFF: chorus/delay not used. CHORUS: chorus. DELAY: the chorus unit works as a stereo delay."
doc = "EM"
pages = [15, 17, 77]

[[param]]
id = "chorus.level"
group = "fx.chorus"
label = "CHORUS LEVEL"
schema = ["fm.pat.cho.chorusLevel"]
values = "0–127"
meaning = "Volume of the sound processed by the chorus."
doc = "EM"
pages = [15, 17, 77]

[[param]]
id = "chorus.output_select"
group = "fx.chorus"
label = "CHORUS OUTPUT SELECT"
schema = ["fm.pat.cho.chorusOutputSelect"]
values = "MAIN, MAIN+REV, REV"
meaning = "Destination of the chorus output. MAIN: stereo to the OUTPUT jacks. MAIN+REV: stereo to OUTPUT and mono to the reverb. REV: mono to the reverb only."
notes = ["[F] Stored order is MAIN, REV, MAIN+REV (MIDI Implementation: 0 MAIN, 1 REV, 2 MAIN+REV)."]
doc = "EM"
pages = [15, 17]

[[param]]
id = "chorus.output_assign"
group = "fx.chorus"
label = "Chorus Output Assign"
schema = ["fm.pat.cho.chorusOutputAssign"]
values = "A, ---, ---, ---"
meaning = "Output of the chorus; only 'A' exists; ignored on reception."
doc = "MI"
pages = [11]

[[group]]
id = "fx.reverb"
title = "Reverb unit settings"
doc = "EM"
pages = [15, 17, 78]
text = "Type-specific parameters: knowledge/chorus_reverb.toml."

[[param]]
id = "reverb.type"
group = "fx.reverb"
label = "REVERB TYPE"
schema = ["fm.pat.rev.reverbType"]
values = "OFF, REVERB, SRV ROOM, SRV HALL, SRV PLATE"
meaning = "OFF: not used. REVERB: basic reverb (with room/stage/hall and delay variations). SRV ROOM: simulates room reverberation in greater detail. SRV HALL: simulates hall reverberation in greater detail. SRV PLATE: simulation of plate echo (a reverb device using a vibrating metal plate)."
doc = "EM"
pages = [15, 17, 78]

[[param]]
id = "reverb.level"
group = "fx.reverb"
label = "REVERB LEVEL"
schema = ["fm.pat.rev.reverbLevel"]
values = "0–127"
meaning = "Volume of the sound processed by the reverb."
doc = "EM"
pages = [15, 17, 78]

[[param]]
id = "reverb.output_assign"
group = "fx.reverb"
label = "Reverb Output Assign"
schema = ["fm.pat.rev.reverbOutputAssign"]
values = "A, ---, ---, ---"
meaning = "Output of the reverb; only 'A' exists; ignored on reception."
doc = "MI"
pages = [11]
